{k:"noy",n:"Noyau",c:9,st:"ok",an:"2019-20 Q52-54 · 2021 S1 QCM 51-52 · 2021 S2 QCM 56-57 · 2021-22 Q5-6"},
{k:"apo",n:"Apoptose",c:8,st:"ok",an:"2019-20 Q69-70 · 2021 S1 QCM 71-72 · 2021 S2 QCM 71-72 · 2021-22 Q15-16"},

{k:"endo",n:"Endocytose et exocytose",c:6,st:"ok",an:"2019-20 Q59-60 · 2021 S1 QCM 59 · 2021 S2 QCM 64 · 2021-22 Q13-14"}];

const SRC="Fiche de cours n°5 – Le réseau endomembranaire 1";const CY="Fiche de cours – Le cytosquelette (partie 2)";const ME="Fiche de cours – Les membranes cellulaires (partie 2)";const CE="Fiche de cours – La cellule";const NO="Fiche de cours – Le noyau";const AP="Fiche de cours n°9 – L’apoptose";const CC="Fiche de cours – Le cycle cellulaire (partie 2)";const MI="Fiche de cours – Les mitochondries";const V2="Fiche de cours n°7 – Le réseau endomembranaire 2";const R3="Fiche de cours – Le réseau endomembranaire 3";
const F=[
{id:"re1",a:0,t:"re",q:"Qu’est-ce que le réseau endomembranaire ?",p:"p.3",s:[["Composition",["Réticulum endoplasmique (RE)","Appareil de Golgi","Lysosomes","Vésicules : communication entre les composants du réseau, et entre le réseau et l’extérieur de la cellule"]]]},
{id:"re2",a:3,t:"re",q:"RE rugueux ou RE lisse : structure et fonctions ?",p:"p.4",s:[["Un seul compartiment",["Une seule lumière et une seule membrane","En relation avec l’enveloppe nucléaire ✪","– pas ou peu de fusion directe ; membrane nucléaire externe en contact avec la membrane du RE"]],["RE rugueux (RER = REG)",["Synthèse de protéines : interaction avec les ribosomes","Très présent dans les cellules sécrétrices (ex : cellules pancréatiques)","Peut représenter 70-80 % du RE total"]],["RE lisse (REL)",["Dépourvu de ribosomes","Généralement moins abondant que le RER – exception : cellules musculaires squelettiques","Synthèse de phospholipides membranaires","Fonctions spécifiques (ex : stockage du Ca²⁺)"]],["Chiffres",["Réseau interconnecté de tubules (REL) et de sacs aplatis (RER)","50 % de la surface membranaire de la cellule (≈ 8000 µm²)","10 % du volume de la cellule ; espace luminal réduit"]]]},
{id:"re3",a:0,t:"re",q:"Comment sépare-t-on RE rugueux et RE lisse ?",p:"p.5",s:[["Centrifugation à l’équilibre",["Séparation selon la densité, avec un gradient de saccharose","RER plus dense (ribosomes) : partie inférieure du gradient","REL : partie supérieure","REL plus difficile à isoler : composition membranaire quasi identique à celle des autres membranes","Possible après une force mécanique qui rompt la membrane plasmique et isole le RE","Obtention de microsomes lisses et rugueux"]]]},
{id:"re4",a:1,n:"Les QCM de Golgi portent surtout sur des notions absentes de cette fiche (KDEL, sens du transport) : à compléter avec la suite du cours.",t:"re",q:"Comment est organisé l’appareil de Golgi ?",p:"p.5-7",s:[["Généralités",["Découvert par Camillo Golgi en 1898","Citernes aplaties empilées et vésicules","Près du noyau et du centre organisateur des microtubules","Très développé dans les cellules à forte activité sécrétoire","Lieu de « maturation » des molécules ; occupe moins de place que le RE"]],["Orientation",["Réseau cis-golgien : proche du RE ; surtout tri et recyclage","Dictyosome : majorité de l’activité ; citernes cis, médianes et trans","Réseau trans-golgien : surtout tri et adressage","Protéines spécifiques de chaque compartiment"]],["Maintien de l’organisation",["Microtubules : localisation périnucléaire","Matrice protéique cytosolique (réseau de protéines sur la face cytosolique des membranes) : intégrité structurale ; interactions directes avec les microtubules","Protéines membranaires : rapprochement entre vésicules et Golgi"]],["Entrées et sorties",["Côté cis : entrée de protéines et de lipides issus du RE ✪","Côté trans : sortie vers la membrane plasmique (exocytose) ou vers d’autres vésicules"]]]},
{id:"re5",a:0,n:"Le lysosome est surtout interrogé dans les QCM d’endocytose (autre cours).",t:"re",q:"Lysosome : rôle et contenu ?",p:"p.7",s:[["Rôle",["Lieu de digestion des macromolécules ; organite riche en enzymes","Environ 100 lysosomes par cellule"]],["Lumière",["Hydrolases acides ✪ : digestion (et parfois modification) des molécules","Nucléases (ADN, ARN), protéases, glycosidases (glucides), lipases (lipides)"]],["Membrane",["Glycoprotéines non enzymatiques sur la face luminale","Glycoprotéines enzymatiques : ex. phosphatase acide (libère du phosphate inorganique réutilisable)","Perméases : ex. sortie du cholestérol issu des LDL","Pompe à H⁺ : acidifie l’intérieur (pH proche de 5) ; transport actif qui consomme de l’ATP ; pH nécessaire à l’activité des hydrolases acides (cytosol : pH ≈ 7,2)"]]]},
{id:"ves1",a:4,t:"ves",q:"Comment fonctionne le transport vésiculaire ?",p:"p.8 et 25",s:[["Principe",["Échanges de macromolécules au sein du réseau et avec l’extérieur","Formation par bourgeonnement à partir d’un compartiment donneur (protéines différentes selon sa nature)","Transport sélectif de lipides et de protéines membranaires (± glucides sur la face luminale)","Maintient l’asymétrie de la membrane plasmique et l’intégrité des compartiments ✪✪","Pas de membrane à traverser pour les molécules solubles"]],["Voie antérograde RE → Golgi (cis)",["Bourgeonnement à partir du RE : vésicules de transport ✪ recouvertes de protéines de recouvrement","2 théories : fusion des vésicules en agrégats tubulaires qui fusionnent avec le Golgi, ou fusion directe avec le réseau cis-golgien","Déplacement des vésicules grâce au cytosquelette","Voie rétrograde : Golgi → RE"]]]},
{id:"re6",a:3,t:"re",q:"Où sont synthétisées les protéines selon leur destination ?",p:"p.9",s:[["Principe",["ARNm synthétisé lors de la transcription, traduit en protéine grâce aux ribosomes"]],["Ribosomes libres (cytosol)",["Protéines cytosoliques, mitochondriales ✪, du peroxysome, nucléaires","Plusieurs ribosomes sur le même ARNm : production de plusieurs protéines identiques (aspect en « sapin de Noël »)"]],["Ribosomes liés au RE",["Protéines adressées à la membrane plasmique ✪, du RE, du Golgi, des lysosomes, des vésicules de transport, ou libérées hors de la cellule","Elles passent dans le RE : présence d’une séquence d’adressage"]]]},
{id:"re7",a:3,t:"re",q:"Comment une protéine est-elle importée dans le RE (SRP, translocateur) ?",p:"p.10-11",s:[["Séquence d’adressage = séquence signal = peptide signal",["Détermine la « destination » de la protéine ; dépend de l’enchaînement des acides aminés","Importation co-traductionnelle ✪ ou post-traductionnelle, mais toujours sélective ✪✪ ; la co-traductionnelle demande moins d’énergie","Au moins 8 acides aminés non polaires ✪ ; généralement du côté N-terminal","Éliminable par une signal peptidase (pas toujours : peut devenir inaccessible dans la structure 3D)"]],["Reconnaissance par la SRP",["SRP = particule de reconnaissance du signal : particule ribonucléoprotéique de 6 protéines + un petit ARN non codant de 300 nucléotides","SRP54 : lie le peptide signal et l’ARNt ; activité GTPase","SRP68 et SRP72 : interaction avec le récepteur de SRP","SRP9 et SRP14 : bloquent la traduction le temps que la protéine entre dans le RE","SRP19 : stabilise la structure"]],["Récepteur de SRP et translocateur",["Le complexe ribosome-SRP se fixe sur le récepteur de SRP ✪ (membrane du RE) : 2 protéines, SRα (côté cytosolique) et SRβ (membranaire)","Hydrolyse du GTP ✪ par SRP54 : libère la SRP et positionne le ribosome sur le translocateur","Translocateur : complexe contenant notamment sec61 ; l’ancrage du ribosome ouvre le canal interne","SRP et récepteur libérés : recyclés"]]]},
{id:"re8",a:2,t:"re",q:"Comment la topologie d’une protéine membranaire est-elle déterminée ?",p:"p.12-14",s:[["Protéine non liée à la membrane",["Mécanisme général (SRP, récepteur de SRP, translocateur), séquence signal N-terminale","Une peptidase coupe la séquence signal : libération dans la lumière du RE","Séquence signal ensuite dégradée par des protéases intramembranaires (ex : SPP) ; fragments éliminés par les protéasomes"]],["1 domaine transmembranaire – cas 1 : signal N-terminal",["Une région d’acides aminés spécifiques forme la région transmembranaire : elle marque la fin de la translocation et conditionne la topologie","La peptidase coupe la séquence signal","Transfert latéral : ouverture latérale du translocateur, la protéine s’en libère"]],["1 domaine transmembranaire – cas 2 : signal interne",["Acides aminés chargés de part et d’autre de la séquence signal : + côté cytosolique, − côté luminal","Rôle d’adressage et de fin de transfert ; détermine la topologie ✪","Selon les charges, N-terminal côté cytosol (cas A) ou côté lumière (cas B)","N’est pas éliminée par une peptidase ✪"]],["Plusieurs domaines transmembranaires",["Séquences « start » (signal d’insertion et d’ancre) et « stop » (bloque la translocation, la portion reste dans la membrane) : une paire par aller-retour","Le 1er domaine entre dans le canal sec61 ; orientation selon la règle « positive inside cell »","Avec un « stop » : le translocon s’ouvre latéralement et libère la protéine dans la bicouche ; la traduction continue dans le cytosol","Un nouveau « start » relance la translocation du segment suivant : « start » démarre une traversée, « stop » bloque et insère"]]]},
{id:"re9",a:0,n:"Pas de QCM direct, mais sec62/sec63 sont tombés dans l’exercice de 2021-22.",t:"re",q:"Comment une protéine entre-t-elle dans le RE après sa traduction ?",p:"p.15-16 (tableau de remplacement)",s:[["Mécanisme",["Traduction terminée avant l’entrée dans la lumière du RE","Passage par un translocateur, associé à un complexe de protéines spécifiques dont sec62 et sec63","Sec62 : reconnaît une séquence hydrophobe de la protéine et guide la chaîne vers sec61 (cofacteur)","Sec63 : recrute la chaperonne BiP (= Hsp70 du RE)","BiP hydrolyse l’ATP pour tirer la protéine vers la lumière du RE","Mécanisme indépendant de SRP / récepteur de SRP"]]]},
{id:"re10",a:3,t:"re",q:"N-glycosylation : quelles sont les étapes ?",p:"p.16-18",s:[["Définition",["Ajout d’un oligosaccharide sur la protéine dans le RER, par une liaison N-osidique impliquant une asparagine","Oligosaccharide de 14 résidus : glucoses, mannoses, N-acétylglucosamines"]],["Fabrication de l’oligosaccharide",["1re étape (face cytosolique) : dolichol (molécule hydrophobe, transporteur poly-isoprénoïde) sert de base ; début de la synthèse (7 résidus) dans le cytosol ✪, par une glycosyltransférase ; énergie : CTP, UDP ; liaison pyrophosphate","Une flippase fait passer l’oligosaccharide à 7 résidus dans la lumière du RE","2e étape (lumière du RE) : allongement à 14 résidus (substrats : oses-P-dolichol) ; transférable sur une protéine"]],["Transfert sur la protéine",["Oligosaccharide-transférase, enzyme liée au translocateur : assure la liaison N-osidique","Reconnaît les 3 résidus glucoses ✪"]],["Modifications",["Dans le RE : élimination de 3 glucoses (glucosidases) et de 1 mannose ; repliement de la protéine après retrait des 2 premiers glucoses","Golgi, étape 2 : élimination de 3 mannoses → oligosaccharide riche en mannose","Golgi, étape 3 : ajout de sucres → oligosaccharide complexe"]]]},
{id:"re11",a:4,t:"re",q:"O-glycosylation et rôles des glycosylations ?",p:"p.19",s:[["O-glycosylation",["Spécifique de l’appareil de Golgi","Ajout d’un glycosaminoglycane (= mucopolysaccharide) sur une sérine ou une thréonine","Protéine + glycosaminoglycane = protéoglycane ✪ : matrice extracellulaire, membrane (transduction de signaux), intracellulaire (stockage et relargage d’eau et de cytokines)"]],["Rôles des glycosylations",["Structure : repliement et stabilisation des protéines","Transport : signal de transport","Membrane plasmique : reconnaissance (ex : antigènes des groupes sanguins ABO) ; protection contre les protéases ; adhérence cellulaire ✪ (ex : cellules sanguines et endothélium) ; modulation de l’activité des protéines"]]]},
{id:"re12",a:3,t:"re",q:"Repliement des protéines : contrôle qualité, protéasome, réponse UPR ?",p:"p.20-21",s:[["Rôle des glycosylations dans le repliement",["Chaperones membranaires ou solubles","1 : 2 des 3 glucoses éliminés par une glucosidase (il en reste 1)","2 : une chaperone reconnaît cet unique glucose et assure le repliement","3 : ce glucose est éliminé par une glucosidase","4 : si bien repliée, la protéine sort du RE vers le Golgi","5 : sinon, nouveau cycle : une glucosyl-transférase rajoute un glucose, signal de reconnaissance des chaperones"]],["Mauvais repliement",["Si le défaut persiste : sortie du RE par le translocateur","Adressage au protéasome ✪ grâce aux ubiquitinylations ; coupée en acides aminés réutilisables"]],["Protéasome 26S",["2 sous-unités : 19S et 20S","19S reconnaît la protéine ubiquitinylée puis la déplie (ATPases)","Injection dans le 20S : dégradation dans la chambre protéolytique (sites actifs peptidasiques)"]],["Réponse UPR (Unfolded Protein Response) ✪",["Accumulation de protéines mal repliées = stress du RE ; la UPR est une réponse adaptative ✪","Stimulation de la transcription de gènes d’élimination (ex : plus de protéasomes) + limitation de la synthèse protéique","Si le débordement perdure : apoptose"]]]},
{id:"re13",a:4,n:"Les items sur les sphingolipides (tombés 3 fois) sont hors programme cette année.",t:"re",q:"Synthèse des lipides membranaires, ancre GPI, glycocalyx ?",p:"p.22-24",s:[["Glycérophospholipides ✪ (REL)",["Synthèse sur la face cytosolique de la membrane du REL","① acyl-transférase : ancre les acides gras dans la membrane et les lie au glycérol-3-phosphate","② phosphatase : élimine le phosphate du glycérol","③ phosphotransférase : ajoute un élément (ex : phosphocholine → phosphatidylcholine)"]],["Ancre GPI ✪",["Synthèse du GPI : début face cytosolique du REL, fin dans la lumière du REL ✪","Association à une protéine initialement transmembranaire, dont l’extrémité C-terminale est éliminée","Dans la membrane plasmique : adressage par les vésicules de transport ; translocation avec une floppase"]],["Glycolipides et glycocalyx",["Glycolipides véhiculés jusqu’à la membrane plasmique par des vésicules","Motifs glucidiques exposés côté extracellulaire (asymétrie) = manteau cellulaire ou glycocalyx","Rôles : protection contre les dommages mécaniques et chimiques ; reconnaissance (radeaux lipidiques)"]]]},
{id:"re14",a:0,t:"re",q:"Autres fonctions du REL ?",p:"p.25",s:[["Fonctions",["Séquestration du Ca²⁺ : réserve nécessaire à la contraction musculaire ; dans la cellule musculaire, le REL = réticulum sarcoplasmique","Synthèse d’hormones stéroïdes dans le REL des cellules de Leydig (riches en REL)"]]]},
{id:"cy1",t:"cyto",a:2,r:CY,q:"Les 3 familles de filaments : diamètre, localisation, rôle ?",p:"p.4-5",s:[["Rôle du cytosquelette",["Ossature de la cellule : assemblage instable de multiples protéines en 3D, changements dynamiques et rapides","Réseau de filaments et de tubules dans tout le cytoplasme et le noyau ; cellules eucaryotes et procaryotes","Organisation spatiale ✪ (forme interne et externe), locomotion et mouvements des cellules, contraction musculaire, trafic cellulaire (« rails » pour organites et molécules)","Confère rigidité (fixe les organites) et adaptabilité (réorganisation permanente, déformations de la membrane, mouvements)"]],["Microfilaments (MF) ou filaments d’actine",["≈ 8 nm ✪ de diamètre : les plus fins ✪ ; les moins résistants","Réseau principalement sous la membrane cellulaire ✪ (cortex cellulaire)","Subissent le plus d’assemblages et de désassemblages","Rôle dans la mobilité, la contraction et l’élasticité"]],["Filaments intermédiaires (FI)",["≈ 10 nm ✪ de diamètre ; les plus stables et les plus rigides (peu déformables)","Réseau dans tout l’espace cytoplasmique ; surtout sous la membrane nucléaire interne (lamina nucléaire)","Rôle dans la structure et la résistance mécanique"]],["Microtubules (MT)",["≈ 25 nm ✪✪✪ de diamètre : les plus épais ✪ ; longueur de moins de 1 µm à 20 µm","Assemblage de tubuline ; cylindre creux rigide ; fibre polarisée (extrémités + et − de stabilité différente) ; labiles ou très stables","Réseau issu d’un centre organisateur des microtubules ✪✪ (MTOC, ex : centrosome) : organise les MT et stabilise l’extrémité (−)","Présents dans toutes les cellules sauf les hématies ; cils et flagelles ; organisation du trafic intracellulaire"]],["Observation",["Filaments : immunofluorescence ; ultrastructure : microscopie électronique"]]]},
{id:"cy2",t:"cyto",a:2,r:CY,q:"Structure d’un microtubule : tubuline, protofilaments, polarité ?",p:"p.6",s:[["Hétérodimère α,β-tubuline ✪",["Structure de base des MT ; stable, libre dans le cytoplasme","Protofilament = empilement d’hétérodimères αβ ; MT = assemblage latéral de 13 protofilaments (cylindre creux)"]],["Tubulines α et β",["Structure similaire","Tubuline α liée à un GTP qui n’est pas hydrolysé","Tubuline β liée à du GTP ou du GDP selon l’état de polymérisation"]],["Polarité",["Extrémité « + » : porte la tubuline β ; extrémité « − » : porte la tubuline α"]],["Doublets et triplets",["Tubule A : MT complet de 13 protofilaments","Tubules B et C : 10 protofilaments propres + 3 protofilaments du MT précédent"]]]},
{id:"cy3",t:"cyto",a:3,r:CY,q:"Centrosome, tubuline γ et MTOC ?",p:"p.7",s:[["Centrosome",["2 centrioles ✪✪ perpendiculaires, entourés de matériel péricentriolaire ✪✪ (= matrice) ; près du noyau ; non membrané","Centriole : cylindre de 9 triplets de MT (diamètre 0,2 µm, longueur 0,4 µm)"]],["Tubuline γ",["Homologue aux tubulines α et β ✪","Nucléation des MT à partir du centrosome, grâce à un anneau de tubuline-γ (stabilisation par des protéines accessoires)","Dans le complexe γ-TuRC (γ-Tubulin Ring Complex) : bloque l’extrémité (−) ; initie et met en place l’élongation"]],["Conclusion",["Les MT s’organisent et croissent à partir du centrosome (matériel péricentriolaire, sites de nucléation)","Ancrés par leur extrémité (−) ✪ ; extrémité (+) libre dans le cytoplasme"]]]},
{id:"cy4",t:"cyto",a:3,r:CY,q:"Instabilité dynamique des microtubules et coiffe GTP ?",p:"p.8-11",s:[["Dynamique in vivo",["MT instables (les plus fréquents) : l’extrémité (+) s’allonge ou régresse rapidement ; l’extrémité (−) reste stable","MT stables : dans l’axonème des cils et des flagelles"]],["Rescue et catastrophe",["Phases de croissance (« rescue ») alternent avec des phases de dépolymérisation (« catastrophes »)","Rescue = passage du raccourcissement à la croissance ; catastrophe = passage de la croissance au raccourcissement","Extrémité (−) enfouie dans le matériel péricentriolaire (tubulines, protéines fibreuses, MAP) : coiffée et stabilisée par γ-TuRC et des protéines d’ancrage de type MAP","Extrémité (+) à la périphérie : polymérisation / dépolymérisation selon les conditions locales (concentration en tubuline, protéines régulatrices)"]],["Rôle du GTP",["L’hydrolyse du GTP en GDP a lieu dans la sous-unité β une fois intégrée au protofilament ; elle est souvent plus lente que l’ajout d’un dimère : coiffe GTP","Dimères tubuline-GTP : liés plus serrés = « coiffe GTP » ✪ (protection de l’extrémité +) ; MT en croissance","Croissance lente : hydrolyse avant l’ajout de nouveaux dimères = perte de la coiffe GTP ✪✪ : sous-unités GDP moins jointives, qui se détachent = catastrophe (dépolymérisation)","Les hétérodimères libérés doivent remplacer le GDP par du GTP ; assez de sous-unités GTP : nouvelle coiffe, croissance (rescue)","Avec coiffe : croissance rectiligne ; sans coiffe : relâchement et incurvation des protofilaments, désintégration progressive"]]]},
{id:"cy5",t:"cyto",a:3,r:CY,n:"Swinholide et latrunculine sont barrés (hors programme), même si la swinholide est tombée en 2021-22.",q:"Drogues agissant sur les microtubules et sur l’actine ?",p:"p.8 et 22",s:[["Microtubules : colchicine, colcémide, vinblastine, vincristine, nocodazole, griséofulvine",["Action anticancéreuse notamment","Se fixent sur les dimères αβ de tubuline et empêchent la polymérisation des MT","Pas de formation du fuseau : arrêt en métaphase, chromosomes dispersés au hasard, mort de la cellule","La colchicine sert à réaliser les caryotypes : le blocage et la dispersion des chromosomes permettent de les étaler sur une lame après éclatement de la cellule"]],["Microtubules : taxol, ixabépilone",["Se fixent sur les MT et les stabilisent (empêchent la dépolymérisation)","Persistance du réseau de MT, blocage du cycle cellulaire, mort de la cellule"]],["Actine : cytochalasines",["Coiffent les extrémités (+) des MF : empêchent polymérisation et dépolymérisation à l’extrémité (+)","Molécules cytostatiques : signal de mort cellulaire par inhibition du dynamisme des MF","Inhibent : locomotion, phagocytose, cytodiérèse, production de filopodes et de lamellipodes","N’inhibent pas : séparation des chromosomes sur le fuseau, contraction musculaire (filaments stables)"]],["Actine : phalloïdine",["Issue de l’amanite phalloïde ; s’associe latéralement aux MF ✪ et les stabilise ✪ : empêche la dépolymérisation","Accumulation de filaments, dysfonctionnement cellulaire ; toxicité hépatique et rénale ; bloque la migration cellulaire","Couplée à un fluorochrome (ex : rhodamine-phalloïdine) : visualise les MF ; seule l’actine F est détectée"]]]},
{id:"cy6",t:"cyto",a:3,r:CY,q:"Protéines associées aux microtubules (MAP) : MAP2, Tau, stathmine, katanine ?",p:"p.12-13",s:[["4 catégories de MAP",["MAP stabilisatrices (protéines structurales) : associent les MT entre eux (faisceaux, réseaux) – ex : MAP2, Tau","MAP déstabilisatrices : interagissent avec les dimères αβ, empêchent la polymérisation – ex : stathmine ✪","MAP de fragmentation : interagissent directement avec les MT – ex : catastrophines, katanine","MAP motrices : moteurs moléculaires qui se déplacent le long des MT"]],["MAP2 et Tau",["Lient latéralement et stabilisent ✪ les MT ; permettent l’interaction des MT avec d’autres constituants (protéines, filaments) ; contrôlent l’espacement des MT","MAP2 : s’associe au MT par une extrémité ; dendrites et corps cellulaire des neurones","Tau : lie ses 2 extrémités au même MT ; axones ; tauopathies (ex : maladie d’Alzheimer) : Tau agrégée et anormalement phosphorylée"]],["Stathmine",["Lie les dimères αβ libres : séquestration de tubuline, ralentit la polymérisation, induit la « catastrophe » ; diminue la concentration en dimères libres"]],["Catastrophines et katanine",["Catastrophines : modifient la fréquence des catastrophes (certaines favorisent la polymérisation) ; kinésine 13 = catastrophine déstabilisatrice, associée à l’extrémité (+) ✪","Katanine : protéine hétérodimérique qui coupe les MT ✪ (de « katana »), en utilisant l’énergie de l’ATP ✪ ; régulée par phosphorylations ; déstabilise les MT"]]]},
{id:"cy7",t:"cyto",a:3,r:CY,q:"Kinésines et dynéines : structure, sens de déplacement ; rôles des microtubules ?",p:"p.14-15",s:[["Moteurs moléculaires des MT",["Se déplacent vers l’extrémité (+) ou (−) ; transportent macromolécules, vésicules et organites (RE, lysosome, mitochondrie) le long des MT, qui servent de rails","2 familles : kinésines et dynéines"]],["Kinésines",["2 chaînes lourdes + 2 chaînes légères","2 têtes globulaires (chaînes lourdes : lient l’ATP et les MT), hélices α surenroulées, queue (2 chaînes légères : lie vésicules ou macromolécules)","Liaison aux récepteurs des vésicules et aux MT en présence d’ATP ; l’hydrolyse de l’ATP permet le déplacement","En général vers l’extrémité (+) du MT ✪ : mouvement antérograde"]],["Dynéines",["2 chaînes lourdes + chaînes légères en nombre variable (lourdes : mouvement le long du MT ; légères : accrochent les éléments à transporter)","2 types : cytoplasmiques et ciliaires","Déplacement vers l’extrémité (−) du MT ✪ : mouvement rétrograde ; hydrolyse d’ATP"]],["Rôles des microtubules",["Localisation des organites : maintien du RE et de l’appareil de Golgi (avec nocodazole, le Golgi se disperse) ; polarisation de la cellule","Transport : kinésine vers la périphérie ; dynéine vers le centre organisateur des MT","Division : fuseau mitotique (émane du centrosome), séparation des chromosomes ; chimiothérapies qui inhibent le fuseau"]]]},
{id:"cy8",t:"cyto",a:0,r:CY,q:"Axonème des cils et des flagelles ; cil primaire ?",p:"p.16-17",s:[["Réseaux de MT",["Pendant la mitose, le réseau de MT interphasiques disparaît au profit du fuseau, puis se reconstitue","Axonème des flagelles et des cils : MT extrêmement stables (pas d’assemblage / désassemblage) ; battement par glissement des MT les uns par rapport aux autres"]],["Axonème d’un cil vibratile",["Dérive d’un COMT au pôle apical de la cellule ciliée (corps basal)","1 paire centrale de MT ✪ et 9 doublets périphériques ✪ ; ponts radiaires ; MT adjacents reliés par des bras de dynéine et de nexine","Battement : mouvement des dynéines le long des MT adjacents, qui fléchit l’axonème"]],["Cil primaire",["Dérive d’un centriole parent ; structure « 9+0 » : pas de paire centrale, 9 doublets périphériques"]],["Pathologies",["Absence des bras de dynéine (externes et/ou internes) ou désorganisation axonémale : spermatozoïdes immobiles (infertilité) ; cellules ciliées de l’appareil respiratoire","Exemple de ciliopathie : syndrome de Kartagener ✪ (pathologie respiratoire, infertilité, situs inversus fréquent)"]]]},
{id:"cy9",t:"cyto",a:3,r:CY,n:"Tableau de remplacement utilisé pour les concentrations critiques ; le bloc « état d’équilibre » est barré (hors programme).",q:"Polymérisation de l’actine : nucléation, concentrations critiques, tapis roulant ?",p:"p.18-21",s:[["Actine et MF",["Localisation : cortex cellulaire (sous la membrane plasmique), protubérances (microvillosités), fibres musculaires","Protéine la plus abondante dans de nombreuses cellules : plaquettes 10 % des protéines totales, cellules musculaires 20 %","Hautement conservée ; 6 isotypes chez les mammifères (α : muscles ; γ ; β : non musculaire)","Monomère : 42 kDa, lié à une ATP ou ADP + un cation divalent","Actine G (globulaire) : monomère soluble, liée surtout à l’ATP ; actine F (filamenteuse) : polymère de 8 nm","MF polarisés (+ / −), hélice dextre ; 1 tour = 13 monomères, 37 nm"]],["Nucléation : complexe ARP ✪",["ARP2/3 fixe les premiers monomères d’actine G libre ; amorce la formation du filament ; stabilise l’extrémité (−)","Rôle similaire à celui de γ-TuRC pour les microtubules"]],["Élongation",["Assemblage des monomères par les 2 extrémités","Hydrolyse de l’ATP en ADP une fois le monomère incorporé ; pas nécessaire pour la polymérisation ✪","Libère du Pi et change l’affinité entre molécules d’actine ; ADP piégé jusqu’à la dépolymérisation ; l’hydrolyse doit avoir eu lieu pour la dépolymérisation"]],["Concentrations critiques",["À chaque extrémité, 2 flux : ajout d’actine-G-ATP (dépend de la concentration) et départ d’actine-G-ADP (indépendant)","Cc = concentration pour laquelle les 2 flux s’équilibrent : au-dessus, l’extrémité grandit ; en dessous, elle raccourcit","Cc(T) à l’extrémité (+), Cc(D) à l’extrémité (−) ; Cc(T) < Cc(D) : ajout plus rapide à l’extrémité (+)","C < Cc(T) : dépolymérisation des 2 extrémités ; C > Cc(D) : les 2 extrémités s’allongent","Entre Cc(T) et Cc(D) : tapis roulant (treadmilling) : l’extrémité (+) s’allonge et la (−) se raccourcit ✪ à vitesse égale, longueur stable","Tapis roulant = flux net et continu de sous-unités de (+) vers (−), pas une alternance de rescue / catastrophe ; recyclage ✪ des monomères (échange ADP en ATP)"]]]},
{id:"cy10",t:"cyto",a:4,r:CY,q:"Protéines liées à l’actine : thymosine, profiline, formine, gelsoline, fimbrine… ?",p:"p.23-28",s:[["Liaison aux monomères libres",["Thymosine : séquestre l’actine G ✪, diminue le pool de monomères compétents, inhibe la polymérisation ✪","Profiline : catalyse l’échange ADP / ATP, accélère le recyclage, augmente le pool de monomères compétents ✪, favorise la polymérisation ✪","Selon leur activité, la concentration en actine G libre favorise l’élongation ou la dépolymérisation"]],["Nucléation, coiffe, rupture",["ARP2/3 : complexe de nucléation ; ARP2 et ARP3 de structure proche de l’actine","Formines : se lient aux extrémités (+) ; facilitent l’incorporation de monomères d’actine ✪ à l’extrémité (+) ✪ : favorisent l’élongation","Gelsoline ✪ : protéine de rupture ✪ ; activée par une forte concentration en Ca²⁺ ; se fixe au polymère ✪, coupe (rupture du MF ✪), reste fixée à l’extrémité (+) puis empêche l’élongation ; dissolution rapide du cytosquelette (ex : exocytose)","Cofilines ✪ : protéines de rupture ; se lient au filament, le fragilisent et facilitent sa destruction","Protéines de la coiffe : coiffent les extrémités, empêchent la polymérisation ; CapZ (extrémité +), tropomoduline (extrémité −)","Tropomyosines : protéines fibreuses, se lient à 7 monomères adjacents ; empêchent l’interaction avec d’autres protéines (notamment déstabilisatrices)"]],["Réticulation et rigidification",["ARP2/3 : nucléation plus efficace associée à un MF préexistant ; réseau arborescent en 3D","Filamine : dimère, 2 sites de liaison ; réseau en mailles tridimensionnel (propriétés de gel)","Fimbrine : monomérique, 2 sites ; faisceaux de filaments parallèles, organisation serrée","Spectrine : tétramère, 2 sites de liaison","α-actinine : dimère, 2 sites ; faisceaux contractiles associés à la myosine II ; empaquetage lâche"]],["3 arrangements des MF",["Faisceaux parallèles (fimbrine) : toutes les extrémités (−) d’un côté et (+) de l’autre","Réseau en mailles, 3D (filamine)","Faisceaux contractiles : cellules musculaires, organisation antiparallèle, myosine (α-actinine)"]]]},
{id:"cy11",t:"cyto",a:3,r:CY,q:"Myosines : structure, fonctionnement, comparaison avec la kinésine ?",p:"p.29-31",s:[["Les myosines ✪",["D’abord la myosine II ✪ : organise les filaments d’actine en faisceaux contractiles (cellules musculaires), contraction musculaire ; puis la myosine I","Superfamille de moteurs : tissus et rôles différents ; toutes se déplacent vers l’extrémité (+) des MF, sauf la myosine VI ✪✪ (vers l’extrémité −)","Plus le bras est long, plus le mouvement est ample : myosine II 5 à 10 nm ; myosine V 30 à 40 nm"]],["Myosine II",["2 chaînes lourdes : extrémités C-terminales en hélice α surenroulées ; têtes globulaires N-terminales = domaines moteurs (site de liaison à l’actine, activité ATPasique)","2 paires de chaînes légères qui régulent l’activité des chaînes lourdes","L’hydrolyse de l’ATP permet de se déplacer le long du filament d’actine ; faisceaux bipolaires : glissement de 2 filaments d’actine de polarité opposée = contraction"]],["Kinésine et myosine : cycles mécanochimiques",["Kinésine : l’hydrolyse de l’ATP fait basculer la tête arrière vers l’avant : « marche » d’une tête à l’autre ✪ ; aussi longtemps fixée que détachée","Myosine : la tête se décroche du MF en présence d’ATP ; l’hydrolyse de l’ATP ✪✪ en ADP la fait basculer vers l’avant et se réassocier un peu plus loin : « saut de puce » ✪ ; plus souvent détachée qu’attachée"]]]},
{id:"cy12",t:"cyto",a:0,r:CY,n:"Le bloc « cortex cellulaire » est barré (hors programme), ainsi que les dimensions des microvillosités.",q:"Rôles des microfilaments : migration, microvillosités, contraction, cytodiérèse, jonctions ?",p:"p.32-35",s:[["Structures à base de MF",["Microvillosités ; fibres de stress et contacts focaux ; lamellipodes et filopodes (migration cellulaire) ; anneau contractile (cytodiérèse)"]],["Mobilité de la cellule",["Filaments d’actine instables ; mobilité indispensable dès le développement embryonnaire ; prolongements pour le déplacement ou l’endocytose / exocytose","Exemple : kératocytes (poissons, amphibiens ; cicatrisation) : déplacement par lamellipodes riches en actine, organites exclus","3 activités au niveau du cortex : fixation (intégrines), protrusion (structures riches en actine repoussées vers l’avant), traction (arrière tiré grâce à la myosine II)","Lamellipode : désassemblage des MF à l’arrière, polymérisation à l’avant ; ARP : nucléation rapide"]],["Microvillosités des cellules digestives",["Armature de filaments d’actine extrêmement stables (pas d’assemblage / désassemblage)","Faisceau de filaments parallèles, reliés par des protéines de fasciculation (villine, fimbrine) ; ancrés à la membrane par des protéines d’ancrage (myosine I)"]],["Contraction musculaire et cytodiérèse",["Filament épais bipolaire de myosines II ; les têtes se rapprochent des extrémités (+) des MF d’actine ✪, rapprochant les disques Z (contraction)","Cytodiérèse = étape finale de la division : anneau contractile d’actine et de myosine II, qui sépare les 2 cellules filles"]],["Jonctions",["Jonctions d’adhérence entre cellules épithéliales : filaments d’actine intracellulaires (réseaux de jonctions cellule-cellule)","Contacts focaux : adhésion à la matrice extracellulaire ; réseau d’actine et intégrines"]]]},
{id:"cy13",t:"cyto",a:2,r:CY,q:"Filaments intermédiaires : types, structure, fonctions ?",p:"p.36-39",s:[["Localisation et particularités",["Autour du noyau, à l’intérieur du noyau, dans le cytoplasme en réseau, sous la membrane (cortex)","Signature de l’origine cellulaire (intérêt en cancérologie : retrouver l’origine d’une métastase)","Fibres de type cordage : assemblage droit en filament fibreux (ni creux, ni hélicoïdal) ; protéines des monomères variables selon l’origine cellulaire, mode d’assemblage commun"]],["Principaux types",["I et II (cytoplasmiques) : kératines acides et basiques ; cellules épithéliales et dérivés (poils, cheveux, ongles) ; hétérodimère obligatoire d’une kératine II avec une kératine I","III : vimentine (cellules mésenchymateuses, fibroblastes) ; desmine (muscle) ; GFAP (cellules gliales : astrocytes, certaines cellules de Schwann) ; périphérine (certains neurones)","IV : neurofilaments protéiques NF-L, NF-M, NF-H (neurones, axones)","V (nucléaire) : lamines A, B et C (lamina nucléaire, face interne de l’enveloppe nucléaire)","VI : nestine (cellules souches neuro-épithéliales)"]],["Mise en place de la structure ✪",["2 monomères : dimère surenroulé ; 2 dimères : tétramère antiparallèle (sous-unité constitutive des FI) ; 2 tétramères associés ; 8 tétramères : FI","Les 2 extrémités sont identiques : pas de polarité structurale ✪ (contrairement aux MT et aux MF)"]],["Fonctions",["FI nucléaires : forment la lamina ; protègent les constituants du noyau (soutien mécanique)","FI de cellules nerveuses (NF-L, NF-M, NF-H) : structurent l’axone et les cellules gliales ; organisent le cytosquelette de l’axone et régulent son diamètre","FI des épithéliums : reliés aux desmosomes et aux hémidesmosomes (épithéliums très cohésifs, solidification du tissu)","Desmosome : relie les FI d’une cellule à ceux de la cellule adjacente (plaques denses) ; hémidesmosome : lie la cellule à la matrice extracellulaire (ancrage à la lame basale) ; mutation d’une cytokératine : peau fragile (maladies bulleuses cutanées)"]]]},
{id:"mem1",t:"mem",a:2,r:ME,q:"Qu’est-ce qu’une membrane biologique : composition et rôles ?",p:"p.3-4",s:[["Les membranes chez les eucaryotes",["Membrane plasmique, enveloppe nucléaire, membranes du réseau endomembranaire (RE, Golgi, lysosomes), membranes mitochondriales : compartiments fermés et spécialisés","Surface des membranes internes ≈ 10 fois celle de la membrane plasmique (7000 µm² contre 700 µm²)","Organite = compartiment délimité par une membrane, avec un fonctionnement propre (noyau, mitochondries, peroxysomes, réseau endomembranaire)"]],["Composition (tableau de remplacement)",["Lipides en bicouche : les phospholipides sont les plus nombreux (jusqu’à 70 % des lipides d’une cellule)","Protéines : 30 à 50 % ✪ selon le type de membrane ; glucides : 5 à 10 %","2 feuillets visibles en microscopie électronique ; épaisseur du double feuillet : 5 à 10 nm","Mosaïque fluide (Singer et Nicholson, 1972) : lipides et protéines en mouvement ; une membrane endommagée peut se réparer"]],["Rôles",["Barrière entre milieux extra- et intracellulaire ; transport sélectif grâce à des protéines","Réception de signaux chimiques (ligand) et électriques ; récepteurs qui déclenchent des réponses intracellulaires","Reconnaissance intercellulaire (chaînes glucidiques, glycocalyx) et adhérence (cohésion, interactions mécaniques)"]]]},
{id:"mem2",t:"mem",a:4,r:ME,q:"Phospholipides et glycolipides : structure, lécithine et céphaline ?",p:"p.5-8",s:[["Lipides",["Molécules organiques insolubles dans l’eau, avec au moins un acide gras et un alcool (ex : glycérol)","Acides gras saturés (pas de double liaison, ex : palmitique) ou insaturés (ex : oléique)","2 sous-types dans la bicouche : phospholipides et glycolipides ; le cholestérol n’est pas un lipide (pas d’acide gras)"]],["Phospholipides",["Amphipathique (biologie cellulaire, biochimie) = amphiphile (chimie) : pôle hydrophile (base azotée ou polyalcool, phosphate, alcool) et pôle hydrophobe (acides gras)","Glycérophospholipides : 2 acides gras + glycérol + phosphate + base azotée ou polyalcool","PE (éthanolamine), PS (sérine, phosphorylable), PC (choline), PI (inositol)","PE et PS = céphalines (découvertes dans les tissus cérébraux)","Phosphatidylcholine = lécithine ✪✪ (découverte dans le jaune d’œuf)","Sphingomyéline : 1 acide gras + sphingosine (alcool aminé) + phosphate + choline ; sphingosine + acide gras = céramide ; sphingolipide parmi les phospholipides","Sphingomyéline : rôle structural, isolant électrique, abondante dans les cellules nerveuses"]],["Glycolipides",["Moins nombreux que les phospholipides ; ex : glycosphingosidolipides (1 acide gras + sphingosine + sucre simple ou complexe)","Protection : barrière physique contre enzymes (lipases, protéases) et agents pathogènes","Reconnaissance cellulaire : signatures moléculaires (interactions cellule-cellule, cellule-MEC, cellule-bactérie / virus, différenciation tissulaire, groupes sanguins ABO)"]],["Organisation spatiale",["Bicouche : pôles hydrophobes face à face, pôles hydrophiles vers les compartiments aqueux ; glycérophospholipides cylindriques (2 chaînes hydrophobes)","Micelle : sphère, plus petite ; acides gras libres de forme conique (1 chaîne hydrophobe)"]]]},
{id:"mem3",t:"mem",a:0,r:ME,q:"Cholestérol et proportions des lipides selon les membranes ?",p:"p.9-10",s:[["Cholestérol",["Noyau stérane rigide, chaîne hydrocarbonée hydrophobe, groupement hydroxyle (−OH) hydrophile ; ≈ 1,5 nm","S’insère entre les phospholipides : module la fluidité (ni trop rigide à basse température, ni trop fluide à haute) ; permet à une cellule de fonctionner entre 35 et 42 °C","Participe aux radeaux lipidiques (riches en sphingolipides et cholestérol)","Précurseur des hormones stéroïdiennes (cortisol, testostérone, œstrogènes, progestérone), des acides biliaires et de la vitamine D","Transporté par les lipoprotéines (LDL, HDL) ; un excès de LDL peut être diminué par les statines"]],["Proportions",["Varient selon le type cellulaire et le type de membrane","Cholestérol très présent dans la membrane plasmique, peu voire pas dans les autres membranes","Glycolipides présents seulement dans la membrane plasmique"]]]},
{id:"mem4",t:"mem",a:3,r:ME,q:"Mouvements des lipides et organisation asymétrique de la membrane plasmique ?",p:"p.11, 13",s:[["Mouvements des lipides",["Diffusion latérale (dans un même feuillet), rotation, flexion ; passage d’un feuillet à l’autre : plus complexe","Flippase : feuillet externe → interne (ex : phosphatidylsérine), dépendante de l’ATP","Floppase : feuillet interne → externe, dépendante de l’ATP","Scramblase : échange dans les deux sens, sans ATP ; surtout en cas de stress ou d’apoptose"]],["Asymétrie de la membrane plasmique",["Glycolipides : uniquement dans le feuillet externe ✪✪","Cholestérol : préférentiellement dans le feuillet externe ; phosphatidylcholines : majoritairement dans le feuillet externe","Phosphatidylsérines : feuillet interne en situation physiologique ; feuillet externe en quantité en cas d’apoptose (et possible en cas de stress)","Phosphatidyléthanolamines : majoritairement feuillet interne","Phosphatidylinositols : majoritairement feuillet interne ; signalisation intracellulaire : le PIP2 est hydrolysé après fixation d’un ligand en DAG (action membranaire, phosphorylation de protéines) et IP3 (libération de calcium par le REL)"]]]},
{id:"mem5",t:"mem",a:2,r:ME,q:"Fluidité membranaire : acides gras, radeaux lipidiques, cavéoles ?",p:"p.11-12",s:[["Nature des acides gras",["Chaînes courtes : interactions hydrophobes faibles, membrane fluide ✪✪","Chaînes longues : interactions plus fortes, membrane rigide"]],["Radeaux lipidiques (micro-domaines de la membrane plasmique)",["Zones dynamiques et transitoires, ordonnées mais moins fluides (riches en cholestérol et sphingolipides)","Concentrent récepteurs et protéines de signalisation ; plateformes pour l’endocytose et l’exocytose sélectives (virus) ; polarisation cellulaire"]],["Cavéoles",["Cavéolines : invagination de la membrane plasmique ; endocytose spécifique (≠ clathrine)","Réservoirs de membranes : adaptation aux variations de quantité de lipides"]]]},
{id:"mem6",t:"mem",a:3,r:ME,q:"Protéines membranaires : rôles, diffusion, topologies, solubilisation ?",p:"p.14-15, 18",s:[["Rôles",["Enzymes, transporteurs, récepteurs, antigènes : elles assurent les fonctions membranaires"]],["Diffusion",["Les protéines se déplacent au sein d’un même feuillet ✪✪","Mise en évidence : fusion d’une cellule humaine et d’une cellule de souris (hétérocaryon), anticorps fluorescents de couleurs différentes : mélange progressif dans le même feuillet","Exception : dans les cellules épithéliales, les jonctions serrées empêchent le passage de protéines de la membrane apicale à la membrane latérale"]],["Topologies",["Transmembranaires (cas 1 à 3) : traversent les 2 feuillets, 1 ou plusieurs traversées ; hélice α ou feuillet β (20-25 acides aminés hydrophobes, liaisons hydrogène)","Associées (cas 4) : feuillet interne, hélice α hydrophobe","Ancrées (cas 5 à 8) : par l’intermédiaire d’un lipide ou d’une protéine"]],["Solubilisation (tableau de remplacement)",["Protéines intrinsèques : transmembranaires ✪ ou associées ; liaisons fortes avec les lipides ; détergents : chargé négativement (SDS ✪) ou non chargé (Triton X-100) ; les détergents se placent entre lipides et protéines","Protéines extrinsèques : ancrées par une protéine ; liaison faible (Van der Waals) ; modification du pH ou de la force ionique ; sels concentrés (NaCl, KCl) ; agents dénaturants doux (urée 2-4 M) pour détacher sans dénaturer"]]]},
{id:"mem7",t:"mem",a:3,r:ME,q:"Modifications des protéines membranaires : glycosylation, acides gras, ancre GPI, mucoviscidose ?",p:"p.16-18",s:[["Glycosylation",["Dans le RE et l’appareil de Golgi, côté extracellulaire","Rôles : protection, reconnaissance et interactions intercellulaires (ex : glycoprotéines de la zone pellucide et protéines du spermatozoïde : spécificité de l’espèce)","≈ 30 maladies associées à des défauts de glycosylation de protéines membranaires"]],["Addition d’acides gras ou de lipides : ancrage ✪",["Côté intracellulaire : myristoylation (acide myristique, co-traductionnelle ; sur la glycine en position 2, N-myristoyltransférase), palmitoylation ✪ (acide palmitique, post-traductionnelle), isoprénylation (farnésyl, géranylgéranyl, post-traductionnelle)","Côté extracellulaire : glypiation = ajout d’un GPI (glycosylphosphatidylinositol)"]],["Ancres GPI",["Permettent à des protéines extracellulaires de rester à la surface sans traverser la membrane ; concentrées dans les radeaux lipidiques ; mobilité latérale ; libérées par clivage de l’ancre","Rôles : reconnaissance et adhésion, protection, signalisation immunitaire","Pas de domaine cytoplasmique : une protéine GPI-ancrée recrute des protéines transmembranaires (ex : CD48 avec 2B4/CD244, cellules natural killer)"]],["Mucoviscidose",["Mutations du gène CFTR : canal ionique qui transporte le chlorure à travers les membranes épithéliales ; mucus épais et visqueux","La glycosylation de CFTR sert au repliement, à la stabilité et au transport vers la membrane plasmique ; mutations : protéine mal repliée, mal glycosylée ou dégradée prématurément"]]]},
{id:"mem8",t:"mem",a:2,r:ME,n:"Les passages barrés de l’électrophorèse (chauffage, SDS, protéines linéaires, ladders) ne sont pas repris.",q:"Électrophorèse SDS-PAGE et immunoblot : principe ?",p:"p.19",s:[["SDS-PAGE",["Séparation des protéines selon leur taille ; le SDS charge négativement les protéines","Gel de polyacrylamide : maillage qui retient les protéines selon leur taille","Champ électrique : migration vers le pôle + ; petites protéines : migrent plus vite (plus bas) ; grosses : restent vers le haut du gel"]],["Immunoblot",["But : mettre en évidence la présence d’une protéine spécifique ✪ et/ou la quantifier","Anticorps primaire : reconnaît la protéine d’intérêt ; anticorps secondaire couplé à un système de révélation : fluorochrome, enzyme (produit coloré), chimioluminescence (ou or colloïdal, élément radioactif)","Un témoin de poids moléculaire permet d’évaluer le poids de la protéine"]]]},
{id:"mem9",t:"mem",a:4,r:ME,q:"Perméabilité de la bicouche, perméases (uniport, symport, antiport) et canaux ?",p:"p.20-21",s:[["Perméabilité",["Petites molécules hydrophobes : diffusent (oxygène ✪, CO₂, N₂)","Petites molécules polaires non chargées : perméabilité faible ; grosses : encore moins","Ions : ne peuvent pas traverser une bicouche lipidique ✪ → transporteurs","L’eau est hydrophile : son passage implique des aquaporines"]],["Protéines de transport",["2 types : perméases et canaux ; protéines transmembranaires à domaines multiples, spécifiques d’une classe de molécules"]],["Perméases",["Uniport : 1 seul soluté","Symport : 2 solutés dans la même direction ✪","Antiport : 2 solutés dans des directions opposées ✪"]],["Canaux",["État fermé ou ouvert ; passage plus rapide qu’une perméase ; toujours un transport passif","Canalopathies : dysfonctionnements de canaux ioniques (Na⁺, K⁺, Cl⁻, Ca²⁺) : musculaire, cardiaque, cérébrale, pulmonaire (mucoviscidose)"]]]},
{id:"mem10",t:"mem",a:4,r:ME,q:"Transport passif et actif : les 4 types, GLUT, aquaporines ?",p:"p.22-24",s:[["Passif ✪ et actif",["Passif : dans le sens du gradient électrochimique (du plus concentré au moins concentré) : diffusion simple, diffusion facilitée (canal ou perméase)","Actif : nécessite de l’énergie ; primaire (ATP, dans le sens contraire du gradient) ou secondaire (le transport d’un soluté dans le sens de son gradient fournit l’énergie pour l’autre)","Uniport actif : seulement primaire ; symport ✪ ou antiport actif : primaire ou secondaire"]],["4 types de transports",["Passif par diffusion simple : sans protéine ; petites molécules hydrophobes non chargées (O₂, CO₂, N₂)","Passif avec un canal : transport sélectif ✪ d’un type d’ion et régulé ✪ (ligand, lumière, ouverture mécanique) ; abondant dans les cellules musculaires et nerveuses","Passif avec une perméase : ex. transporteurs du glucose GLUT ✪✪ : sélectif, parfois régulé (nombre de perméases à la membrane)","Actif avec une perméase : énergie extérieure (lumière, hydrolyse de l’ATP) ou couplage avec un transport passif, qui fournit l’énergie ✪"]],["Canaux sensibles à la tension (2 modèles)",["Modèle 1 : étirement de la membrane sous pression, qui force le canal à s’ouvrir","Modèle 2 : traction par des liens avec la matrice (extérieur) ou le cytosquelette (intérieur)"]],["Aquaporines",["Transport rapide et régulé de l’eau (globules rouges, reins, cerveau) ; découvertes par Agre et MacKinnon (1988, Nobel de chimie 2003)","Tétramères : chaque monomère forme un canal à eau toujours ouvert ; une dizaine chez les vertébrés","Aquaporine 2 (épithélium rénal) : mutations → diabète insipide (urine très diluée, 8 à 10 L/jour)"]]]},
{id:"mem11",t:"mem",a:2,r:ME,n:"Les mots barrés (« est une perméase qui ») ne sont pas repris.",q:"Transporteurs ABC, pompe Na⁺/K⁺ et cellule épithéliale intestinale ?",p:"p.25-28",s:[["Transporteurs ABC (ATP Binding Cassette)",["2 domaines transmembranaires + 2 domaines cytoplasmiques qui hydrolysent l’ATP ; conservés des bactéries à l’Homme","Procaryotes : import et export ; eucaryotes : uniquement export","Inactivation : maladies génétiques (ex : hyperinsulinisme familial) ; surexpression : résistance à certains médicaments (anticancéreux)"]],["Pompe Na⁺/K⁺",["Transport actif primaire ✪ : 3 Na⁺ ✪ sortent, 2 K⁺ ✪ entrent, contre leurs gradients, avec l’ATP ; consomme 25 % de l’ATP cellulaire","Concentrations : extracellulaire [Na⁺] 135-145 mM, [K⁺] 3,5-5 mM ; intracellulaire [Na⁺] 5-15 mM, [K⁺] 140 mM","Rôles : équilibre osmotique, propagation des signaux électriques (nerf, muscle)","Cycle : Na⁺ lié côté cytosolique → phosphorylation par l’ATP → changement de conformation, Na⁺ éjecté → prise en charge du K⁺ → déphosphorylation → K⁺ libéré dans la cellule"]],["Cellule épithéliale intestinale",["Perméase couplée (transport actif secondaire) : le sodium entre dans le sens de son gradient et aide le glucose à entrer contre le sien","Pompe Na⁺/K⁺ (partie basale) : actif, contre les gradients","Perméase du glucose (partie basale) : transport passif ✪, sortie du glucose dans le sens de son gradient"]]]},
{id:"cell1",t:"cell",a:0,r:CE,q:"Théorie cellulaire : qu’est-ce qui définit une cellule ?",p:"p.3",s:[["Théorie cellulaire",["17e siècle : Robert Hooke observe des tissus végétaux (tranche de liège) : petites chambres appelées « cellula »","19e siècle : Schleiden et Schwann : les cellules sont les unités structurales et fonctionnelles du vivant","Virchow : les cellules sont les unités de reproduction du vivant ; elles naissent d’autres cellules (« Omnis cellula e cellula »)"]],["Caractéristiques d’une cellule (tableau de remplacement)",["Reproductrice ; autonome (la plupart ont besoin de communications avec d’autres cellules ; les cellules du sang n’ont pas besoin de contacts rapprochés) ; fonctionnelle ; échanges avec l’extérieur (oxygène, nutriments, déchets) ; membranes sélectives","Éléments nécessaires : acides nucléiques (ADN, ARN : information génétique) ; protéines (catalyseurs, transport, structure, mouvements ; obtenues par traduction des ARNm issus de la transcription) ; glucides et lipides (rôles structural et énergétique)"]]]},
{id:"cell2",t:"cell",a:4,r:CE,q:"Procaryotes, eucaryotes, 3 domaines du vivant : caractéristiques ?",p:"p.4-7",s:[["2 grandes classes de cellules ✪ et 3 domaines",["Procaryotes ✪ : apparus il y a 3 milliards d’années ; classe la plus importante quantitativement","Eucaryotes ✪ : apparus il y a 900 millions d’années ✪","Ancêtre commun ; ordre d’apparition : eubactéries, archaebactéries, eucaryotes (3 domaines, grâce à la comparaison des ARN ribosomaux)","Un sous-groupe d’archées, les Hodarchaeales, serait le plus proche des eucaryotes ✪ (Nature 2023)"]],["Procaryotes",["Compartimentation minimale : membrane plasmique, pas de noyau ni d’organites ; cytosquelette et ribosomes ; éléments facultatifs : paroi, capsule (rôle protecteur)","Diamètre moyen ≈ 1 µm ✪","Génome : une seule molécule d’ADN circulaire au niveau du nucléoïde ; 1.10⁶ à 5.10⁶ paires de bases","Reproduction par scissiparité (fission binaire) : duplication de l’ADN, attache des 2 copies à la membrane, allongement, séparation : 2 cellules filles génétiquement identiques (sauf mutation)","Eubactéries ✪ : bactéries « classiques », pathogènes ou non (ex : microbiote) ; archaebactéries : caractéristiques intermédiaires, habitats hostiles, non pathogènes ✪"]],["Eucaryotes",["Compartimentation complexe : noyau, organites, cytosquelette","Diamètre moyen de 10 à 100 µm (10 à 100 fois celui des procaryotes) ; la plupart entre 10 et 20 µm","Génome dans le noyau : plusieurs molécules d’ADN linéaire ; 1,5.10⁷ à 5.10⁹ paires de bases (10 à 1000 fois plus grand) ; mitochondries et chloroplastes ont leur propre génome","Reproduction par mitose et méiose"]]]},
{id:"cell3",t:"cell",a:3,r:CE,n:"La phrase barrée sur les bactériophages (infectent spécifiquement des procaryotes) n’est pas reprise.",q:"Acaryotes : virus et bactériophages ?",p:"p.4",s:[["Acaryotes",["Bactériophages et virus ✪ : entités biologiques non vivantes (ce ne sont pas des cellules)","Un seul type d’acide nucléique (ADN ou ARN) ; pas de métabolisme propre ; parasitisme obligatoire","Se reproduisent après infection, avec la machinerie de la cellule hôte (eucaryote ou procaryote)","Taille : 10 nm ✪ ; exemples : virus de la grippe (ARN), papillomavirus (ADN)"]]]},
{id:"cell4",t:"cell",a:4,r:CE,q:"Eucaryotes unicellulaires et multicellulaires, agents pathogènes ?",p:"p.8-10",s:[["Unicellulaires",["Protozoaires, levures ✪, algues ✪ ; tous les protistes sont unicellulaires, mais pas tous les unicellulaires sont des protistes","Capacité de survie indépendante ✪✪ : reproduction, multiplication et fonctionnement indépendants","Protozoaires : milieux humides ; ex : Plasmodium falciparum (paludisme), paramécie, amibe, euglènes…","Levures ✪✪ : nutrition hétérotrophe, reproduction principalement asexuée ; ex : Saccharomyces cerevisiae","Algues : chloroplastes (lumière, CO₂, sels minéraux) ; reproduction sexuée ou asexuée ; ex : Chlamydomonas"]],["Multicellulaires",["Végétaux, champignons, animaux (dont l’Homme) ; perte de la capacité de survie indépendante des cellules","Homme : 3.10¹³ à 10.10¹³ cellules (plutôt 3.10¹³) ; 200 types cellulaires, même génome ; 4 types de tissus (épithélial, musculaire, conjonctif, nerveux)","Exceptions : cellules libres du sang et de la lymphe ; cellules germinales dans les gonades"]],["Agents pathogènes pour l’Homme",["Unicellulaires : bactéries (Streptococcus, Mycoplasma, Treponema pallidum), protozoaires (Plasmodium falciparum)","Pluricellulaires ✪ : vers (ex : Enterobius vermicularis, oxyurose)","Virus : VIH, grippe, poliomyélite, SARS-CoV-2"]]]},
{id:"cell5",t:"cell",a:1,r:CE,n:"Les phrases barrées (« lieu de présence d’organites ») ne sont pas reprises. Tableaux de remplacement utilisés.",q:"Cellule animale : composants, cytoplasme, mitochondries, communication ?",p:"p.11-12",s:[["Cellule animale eucaryote type",["Forme : plutôt anguleuse dans les tissus, ronde pour les cellules circulantes","Membrane plasmique : sépare la cellule de l’extérieur, barrière protectrice, rôle dans les échanges ; noyau : matériel génétique ; cytoplasme = cytosol + organites"]],["Cytoplasme",["Gel colloïde 4 fois plus visqueux que l’eau ; pH neutre ; 85 % d’eau ; ions (Na⁺, K⁺, Cl⁻) ; gaz ; glucose, glycogène, lipides ; protéines nombreuses (200 mg/mL) ; ARN","Rôles : réserve, réactions métaboliques (glycolyse, synthèse des protéines), transduction du signal (second messager), transit de molécules entre compartiments"]],["Organites",["RE : synthèse de lipides et protéines ; Golgi : modification des lipides et protéines, synthèse de la matrice extracellulaire ; cytosquelette : organisation, mouvements, échanges intracellulaires","Mitochondrie : respiration cellulaire, mort cellulaire programmée ; lysosomes : digestion des macromolécules, transformation de certaines molécules ; peroxysome : oxydation de molécules organiques ; vésicules : échanges entre compartiments","Origine des mitochondries : endosymbiose (une cellule eucaryote ancestrale anaérobie phagocyte une bactérie aérobie)"]],["Interactions cellulaires",["Communication paracrine : avec les cellules voisines ; autocrine : exocytose d’éléments qui reviennent se fixer sur la cellule ; endocrine : hormones dans le sang, action à distance"]]]},
{id:"cell6",t:"cell",a:1,r:CE,q:"Organismes modèles d’étude de la cellule ?",p:"p.13",s:[["Modèles",["Escherichia coli : réplication de l’ADN et synthèse protéique","Levure Saccharomyces cerevisiae : division cellulaire","Mouche Drosophila melanogaster : développement embryonnaire, voies de signalisation","Ver Caenorhabditis elegans : mort cellulaire programmée (apoptose)","Souris : études génétiques (animaux OGM, KO, surexpression), développement, immunologie"]]]},
{id:"cell7",t:"cell",a:4,r:CE,n:"Les valeurs barrées (grossissement réel du ME, 10 fois plus faible du MEB) ne sont pas reprises.",q:"Microscopie : optique, fluorescence, confocale, électronique (résolution) ?",p:"p.13-15, 19",s:[["Systèmes d’observation",["Œil : objets > 1 mm ; microscopes optiques : de 0,2 mm à 0,2 µm (cellule eucaryote de 10 à 20 µm) ; microscopes électroniques : de 0,2 mm à 0,2 nm (pas les atomes)"]],["Microscope optique (MO)",["Résolution maximale : 0,2 µm ✪ (valeur réelle ; théorique 0,1 µm) = capacité à distinguer 2 objets contigus ; grossissement jusqu’à ×1000 ✪ ; utilise les photons","Échantillons : étalement cellulaire, coupe histologique colorée (2 à 8 µm), cellules vivantes en culture sans coloration","Image en noir et blanc, colorée ou fluorescente ; 2D ou reconstruction 3D"]],["Microscope à fluorescence",["Marqueurs fluorescents (fluorochromes) ; filtre d’excitation puis d’émission ; λ émission > λ excitation ; couleur vive sur fond noir","Épifluorescence ou confocal (lumière laser, mesure point par point puis plan par plan, reconstruction 3D)"]],["Microscope électronique (ME)",["Résolution 0,2 nm (valeur réelle ; théorique 0,1 nm) ; grossissement jusqu’à ×1 000 000 en théorie ; électrons, sous vide ; contrastes grâce aux métaux lourds","MET : coupes très fines (60 à 100 nm, ultramicrotome), intérieur de la cellule, noir et blanc, contraste à l’uranium et au plomb","MEB : surfaces cellulaires ✪, absence de coupe ✪ ; résolution inférieure au MET ; noir et blanc, tridimensionnelle ; échantillons recouverts de métaux lourds"]]]},
{id:"cell8",t:"cell",a:3,r:CE,n:"Barrés : « 30 kDa » (GFP), le bloc « logiciels de traitement des images », la mention « glucagon » et « ex : tube de Ficoll ».",q:"Préparation des échantillons, colorations et marquages (hématoxyline, DAPI, GFP, immunomarquage, FISH) ?",p:"p.16-18, 20-21",s:[["Préparation",["Fixation (non obligatoire, fige l’échantillon) ; déshydratation (évite la diffraction de la lumière ; plus importante en ME) ; inclusion (rigidifie : paraffine pour MO, résines plastiques pour MET) ; coupe (microtome) ; coloration ou marquage","MEB : métallisation directement après la déshydratation, pas de coupe ; MET : métallisation après la coupe"]],["Colorations et marquages directs",["Hématoxyline : marque le noyau ✪ (ADN), coloration bleue ✪ ; éosine : cytoplasme et matrice extracellulaire, rose violet ; Oil red O : lipides, rose","DAPI ✪ et Hoechst : noyaux, bleu ; Hoechst perméant (cellule vivante) ; DAPI peu perméant (cellule morte ou perméabilisée)","GFP : petite protéine fluorescente ; vecteur gène GFP + gène de la protéine d’intérêt, transfection, protéine hybride fluorescente : localisation et trafic","ME : uranium (acétate d’uranyle) et plomb (acétate de plomb) ; or colloïdal couplé à un anticorps (particules de tailles différentes pour marquer des protéines différentes)"]],["Marquages spécifiques",["Immunocytochimie et immunohistochimie : 1er anticorps reconnaît un épitope ; second anticorps ✪✪ couplé à un système de révélation (peroxydase : produit marron ; fluorochrome : fluorescéine verte) ; plusieurs anticorps secondaires par anticorps primaire : marquage plus intense","FISH : sondes d’ADN fluorescentes qui s’hybrident à l’ADN (ou l’ARN) : anomalies du nombre de chromosomes, translocations, délétions"]]]},
{id:"cell9",t:"cell",a:3,r:CE,n:"Les siARN et la GFP servent surtout dans les exercices d’expériences (ex : 2021-22).",q:"Tri cellulaire : cytométrie en flux, billes magnétiques, gradient de densité, siARN ?",p:"p.22-24",s:[["Cytométrie en flux (tableau de remplacement)",["Différencie des populations cellulaires : anticorps couplés à un fluorochrome ; passage de centaines de milliers de cellules une à une dans un tube en verre ; excitation à différentes longueurs d’onde (un fluorochrome ne s’excite qu’à une longueur d’onde) : on sait si une protéine est présente","FACS : sépare des types cellulaires selon la présence d’un marqueur fluorescent","Technique spécifique, mais sans image précise de la localisation des protéines (contrairement à la confocale)","Applications : sous-typage des lymphocytes T (CD4, CD8) ; quantification des macrophages alvéolaires (CD45, CD11b, CD11c)"]],["Billes magnétiques",["Anticorps liés à des billes magnétiques ; technique simple, moins coûteuse que la cytométrie en flux","Reconnaissance d’une protéine spécifique à la surface des cellules ; aimant : rétention des cellules d’intérêt, élimination des autres ; variation de pH pour libérer les cellules"]],["Gradient de densité",["Séparation des types cellulaires ✪✪ selon leur densité ; très peu coûteuse","Gradient de densité dans un tube, dépôt du mélange cellulaire, centrifugation : chaque type cellulaire se place à une couche de densité donnée"]],["siARN",["Cible un ARNm spécifique et empêche sa traduction : absence de la protéine","Permet d’étudier les conséquences de l’absence de la protéine d’intérêt"]]]},
{id:"noy1",t:"noy",a:0,r:NO,n:"Barrés non repris : « pyrénocyte » et l’exemple de l’effort prolongé (fermentation).",q:"Le noyau : présence, nombre, cellules sans noyau ou multinucléées ?",p:"p.3-5",s:[["Le noyau",["Compartiment fermé et spécialisé, propre aux eucaryotes, qui contient une grande partie du matériel génétique","Généralement 1 seul noyau par cellule ; lieu de synthèse de l’ADN (réplication) et de l’ARN (transcription) ; échanges obligatoires avec le cytosol (traduction)","Structure : enveloppe nucléaire (2 membranes), chromatine (ADN lié à des protéines), nucléole (noir, dense aux électrons ✪), nucléoplasme"]],["Cellules sans noyau",["Érythrocytes (120 jours de vie, expulsion du noyau avec calcium, plus d’hémoglobine, ne se divisent plus), kératinocytes de surface (barrière physique, gradient de calcium), plaquettes (morceaux de membrane et de cytoplasme ; arrêt du saignement, immunité, inflammation)"]],["Cellules multinucléées",["Cellules musculaires squelettiques : fusion de myoblastes (cellules satellites en cas de régénération) ; plusieurs noyaux : contrôle de la synthèse protéique sur toute la longueur et réponse rapide aux besoins métaboliques","Ostéoclastes : détruisent les tissus osseux vieillissants et malades (résorption > formation : fragilité, fractures)"]]]},
{id:"noy2",t:"noy",a:4,r:NO,n:"Barrés non repris : protéines accessoires de la lamina et lien plus particulier avec l’hétérochromatine.",q:"Enveloppe nucléaire et lamina : structure, rôles, laminopathies ?",p:"p.6-7",s:[["Enveloppe nucléaire",["2 membranes concentriques (interne et externe) ; espace périnucléaire ≈ 30 nm ; pores nucléaires ; réseau protéique : lamina nucléaire","En continuité avec le réticulum endoplasmique ✪ : la membrane externe communique avec celle du RE"]],["Lamina nucléaire",["Protéines filamenteuses : lamines A, B et C (type filaments intermédiaires ; dissociation possible par phosphorylation)","Face interne de l’enveloppe nucléaire ✪","Rôles : soutien (forme du noyau) ; interactions avec les nucléoporines (stabilisation des pores) ; étroite relation avec la chromatine ✪ (transcription, épissage, synthèse d’ADN)"]],["Laminopathies ✪",["301 mutations du gène LMNA (chromosome 1) codant pour les lamines A et C ✪ : plus de dix pathologies (tissu isolé, ou syndromes de vieillissement prématuré)","Lipodystrophie partielle de Dunnigan : mutation faux sens du codon 482 de LMNA ; lipoatrophie des membres et du tronc, accumulation faciale de graisses, hyperinsulinisme et hypertriglycéridémie"]]]},
{id:"noy3",t:"noy",a:3,r:NO,q:"Pores nucléaires : structure et constituants ?",p:"p.8",s:[["Structure",["Visibles en microscopie électronique ; ≥ 50 nucléoporines en symétrie octogonale ✪ (au moins 30 distinctes)","1 canal central et 8 canaux latéraux ; complexe de 120 000 kDa"]],["Constituants",["8 colonnes ✪ qui délimitent les canaux latéraux","5 anneaux ✪ : interne, cytoplasmique, externe, nucléaires 1 et 2","Filaments protéiques ✪ : cytoplasmiques (côté cytosol) et nucléaires (relient les anneaux nucléaires 1 et 2)"]],["Rôles et régulation du trafic",["Transport des protéines nucléaires et des ARN","Import (cytosol vers noyau) : polymérases, lamines, protéines régulatrices ; export : ARN, protéines régulatrices","Régulation : nombre de pores (cellule en prolifération : plus de pores, import d’histones, export de sous-unités ribosomales) ; masquage / démasquage des séquences NLS et NES (phosphorylation ou ligand hormonal) ; séquestration cytoplasmique"]]]},
{id:"noy4",t:"noy",a:4,r:NO,q:"Transport nucléaire des protéines : NLS, NES, importine, exportine, Ran (GEF, GAP) ?",p:"p.10-12",s:[["2 types de transports",["Simple diffusion : petites molécules solubles, par les canaux latéraux","Transport actif : ARN et protéines > 50 000-60 000 Da, par le canal central ✪, avec énergie"]],["Séquences d’adressage",["Import : SLN (ou NLS), souvent des acides aminés basiques ; séquence classique PPKKKRKV","Export : SEN (ou NES), riche en leucine ✪ ; séquence classique LALKLAGLDI","Sans SLN : marquage cytoplasmique ; avec SLN : strictement nucléaire (mise en évidence par transfection d’une protéine chimère)"]],["Les 3 intervenants",["Protéine à transporter (SLN et/ou SEN) ; transporteur : importine ou exportine","Fournisseur d’énergie : la petite protéine G Ran ; Ran-GDP inactive ; échange GDP par GTP ✪ grâce au facteur GEF ; hydrolyse du GTP en GDP accélérée par GAP (le passage de Ran-GTP à Ran-GDP fournit l’énergie)"]],["Importation",["1) Importine + protéine à SLN dans le cytosol ; 2) passage par le canal central ; 3) dans le noyau, Ran-GTP dissocie le complexe ; 4) fixation de Ran-GTP ✪ à l’importine : libération de la protéine (forte affinité pour Ran-GTP) ; 5) l’importine / Ran-GTP repasse dans le cytosol ; 6) hydrolyse du GTP (GAP) : libération de l’importine (faible affinité pour Ran-GDP)"]],["Exportation",["1) Dans le noyau ✪, triptyque exportine + Ran-GTP + protéine à SEN ; 2) passage par le canal central ; 3) dans le cytosol, hydrolyse du GTP (GAP) : libération de la protéine et de l’exportine","Stock de GEF dans le noyau, stock de GAP dans le cytosol"]]]},
{id:"noy5",t:"noy",a:3,r:NO,n:"Barré non repris : « élimination du complexe CBC » par l’hélicase.",q:"Transport des ARN (mRNP, ARNr, ARNt) et complexes RNP ?",p:"p.13-15",s:[["Complexes RNP (ribo-nucléoprotéiques)",["ARN souvent matrice ; les protéines apportent stabilité et spécificité","Ribosome (rRNP : traduction) ; spliceosome (snRNP : épissage des pré-ARNm) ; snoRNP (modification chimique des ARNr) ; RNP de télomérase (allongement des télomères) ; RISC (miRNA / siARN) ; mRNP (stockage / transport des ARNm)"]],["ARNm sous forme de mRNP ✪ (indépendant de Ran-GTP)",["Complexe CBC (Cap-Binding Complex) : se fixe sur la coiffe 5’ dès la synthèse, protège contre les exonucléases, recrute des facteurs d’export","hnRNP : se lient à l’ARN prémessager, déterminent sa structure secondaire, participent à l’épissage, marquent les ARNm pour l’export","Queue poly(A) : ajoutée en 3’ par la poly(A) polymérase, protège de la dégradation, recrute le complexe d’initiation de la traduction ; longueur = indicateur de stabilité","Hélicase : remodelage des protéines associées au mRNP, avec de l’ATP","Passage : interactions avec les FG-nucléoporines (motifs phénylalanine-glycine), de proche en proche ; mécanisme actif"]],["ARNr et ARNt",["Export avec des exportines et Ran-GTP / Ran-GDP, comme les protéines ; passage par les FG-nucléoporines","ARNr : forment la petite (40S) et la grande (60S) sous-unité du ribosome, déjà formées dans le noyau avec leurs protéines ; ARNt : lien entre ARNm et acides aminés"]]]},
{id:"noy6",t:"noy",a:3,r:NO,n:"Le mot « protéique » (synthèse) est barré dans le poly.",q:"Nucléole et gènes ribosomaux : structure, rôle, ARN polymérases ?",p:"p.16-18",s:[["Nucléole",["Non délimité par une membrane ✪ ; apparaît pendant l’interphase ✪ (G1-S-G2) ; taille variable selon l’activité de synthèse et le cycle cellulaire","Début de G1 : plusieurs petits nucléoles, faible transcription ; fin de G1 : un gros nucléole unique, forte transcription","Rôle : site de synthèse des ARN ribosomaux"]],["4 régions identifiables au MET ✪ (après DNase)",["① Centre fibrillaire : régions intergéniques non transcrites, ADN très compact","② Composant fibrillaire dense : transcription des ARN ribosomaux (sauf l’ARN 5S)","③ Composant granulaire : maturation des ARN ribosomaux","④ Nucléoplasme : synthèse des ARNm (2 à 5 % des ARN), assemblage des particules pré-ribosomiques"]],["Organisateurs nucléolaires et gènes ribosomaux",["Boucles d’ADN qui rapprochent les domaines de l’ADN ✪ contenant les gènes des ARN ribosomaux : gènes 45S sur les chromosomes 13, 14, 15, 21 et 22 ; ≈ 200 copies par génome haïploïde","Gène 45S : ARNr 28S, 18S, 5,8S ; transcription par l’ARN polymérase I ✪ dans le nucléole ✪ (ARN 45S précurseur, puis coupures)","Gène 5S : ARNr 5S ; ARN polymérase III, en dehors du nucléole (nucléoplasme)","Grande sous-unité : 5S + 28S + 5,8S ; petite sous-unité : 18S ; assemblage global dans le cytosol"]]]},
{id:"noy7",t:"noy",a:4,r:NO,n:"Barrés non repris : lyse par choc osmotique, « plusieurs origines de réplication », 146 + 27 pb (x2), « et C-terminale », « rôle mal connu » (H1), syndrome de Turner.",q:"Chromatine : fibre de 30 nm, nucléosome, histones, chromosomes ?",p:"p.18-22, 25",s:[["Chromatine",["ADN + protéines ; observable après marquage DAPI ou Hoechst","Mitose : chromatine condensée (chromosomes individualisés) ; interphase : masse peu dense, chromatine relativement lâche, accessible à la réplication (phase S)","Compaction : ADN (≈ 2 m) tient dans un noyau de 5 µm ; variée au cours du cycle ; dynamique (complexes de remodelage, modifications des histones)"]],["Chromosome en mitose",["2 chromatides (700 nm), associées au centromère (cohésines) où se fixe le kinétochore ; bras longs et courts, télomères","Degrés de compaction : ADN, fibre de 10 nm, fibre de 30 nm, chromatide"]],["Fibre de 30 nm",["Euchromatine = fibre claire : activation génique ; hétérochromatine ✪ = fibre dense : inactivation génique (centromères : hétérochromatine constitutive, ADN α-satellite de 171 pb)","Structure dynamique ✪ de la fibre de 30 nm (modèle de l’accordéon)","Fibre de 10 nm : n’existe pas à l’état physiologique ; structure en « chapelet » ; histones propres aux eucaryotes et aux archéobactéries"]],["Nucléosome",["Unité de base : ADN + histones (régions riches en A-T, liaisons non covalentes) ; diamètre 10-11 nm ; 146 pb autour des histones et 54 pb d’ADN de liaison : 200 pb ; 1,5 à 1,8 tour","Octamère de 4 types d’histones H2A, H2B, H3 et H4, chacun en 2 exemplaires"]],["Histones",["Petites protéines basiques, chargées positivement (interaction avec l’ADN négatif) ; très conservées (cœur commun ; différences N-terminales)","Hétérodimères H2A-H2B et H3-H4 ; modifications post-traductionnelles dans la région N-terminale","H1 : hors du nucléosome ; participerait à la compaction de la fibre de 30 nm (empilement des nucléosomes) et à sa stabilisation"]],["Diversité des chromosomes",["Chromosomes en écouvillon (ovocytes d’amphibiens) : boucles actives, MO ; polyténiques (glandes salivaires de drosophile) : régions sombres condensées et claires décondensées actives","Homme : 3 x 10⁹ pb par génome haïploïde ; caryotype normal : 23 paires dont 22 autosomales et 1 paire sexuelle ; anomalies du nombre (anéuploïdies, ex : trisomie 21) et de structure (taille, forme, bandes)"]]]},
{id:"noy8",t:"noy",a:3,r:NO,q:"Modifications des histones et complexes de remodelage de la chromatine ?",p:"p.23-24",s:[["Modifications post-traductionnelles des histones (tableau de remplacement)",["Acétylation, méthylation, phosphorylation : recrutement d’autres protéines, régulation de l’expression des gènes","Acétylation par les HAT (histones acétyl transférases) : décompaction de l’ADN ✪, favorable à la transcription (fibre accessible)","Déacétylation par les HDAT (histones déacétylases) : compaction de l’ADN, moins accessible à la machinerie transcriptionnelle","Citrullination de l’histone H3 : des cellules immunitaires expulsent une partie de leur ADN (pièges extracellulaires contre les bactéries), en restant vivantes"]],["Complexes de remodelage de la fibre chromatinienne",["Permettent la formation et la destruction des nucléosomes : rendre l’ADN accessible à la réplication, à la réparation ou à la transcription (régions accessibles = euchromatine)","Système à 2 complexes (A et B) : l’un désassemble les nucléosomes, l’autre les réassemble","Machinerie protéique qui utilise l’ATP ✪✪"]]]},
{id:"apo1",t:"apo",a:4,r:AP,n:"Barré non repris : « certaines cellules très endommagées ou infectées vont également mourir par apoptose ».",q:"Rôles physiologiques de l’apoptose et mort cellulaire pathologique ?",p:"p.3-4",s:[["Contrôle de la taille des populations",["Développement, croissance et vie d’un organisme dépendent de la production, de la prolifération, de la différenciation et de la destruction des cellules","Maintien de la taille des tissus : vitesses de production et de destruction à l’équilibre"]],["Développement embryonnaire",["Morphogenèse : apoptose dans la région interdigitale pendant la vie fœtale (élimination de la palmure, séparation des doigts)","Élimination de structures : queue des têtards ; régression du canal de Wolff ou de Müller selon le caryotype (différenciation des appareils génitaux)"]],["Adulte",["Régulation de l’homéostasie tissulaire : élimination des lymphocytes qui réagissent contre les antigènes du soi","Follicules ovariens : 99,9 % éliminés par apoptose ; permet la folliculogenèse ✪ chez l’adulte ; apoptose importante aussi lors de la gamétogenèse masculine"]],["Mort cellulaire pathologique",["Déficit de mort : cancers (les cellules prolifèrent et ne meurent plus) ; maladies auto-immunes (non-élimination des lymphocytes autoréactifs ✪✪)","Excès de mort : SIDA (déplétion des lymphocytes T), maladies neurodégénératives (Alzheimer, Parkinson, sclérose amyotrophique latérale), lésions ischémiques (infarctus du myocarde, AVC)"]]]},
{id:"apo2",t:"apo",a:1,r:AP,q:"Apoptose versus nécrose : critères morphologiques ?",p:"p.5-6",s:[["Première description",["Kerr, 1972 : observation de cellules isolées en train de mourir : « apoptose » (apo = éloigner, ptose = chute) ; il l’a appelée mort cellulaire programmée"]],["Apoptose",["Cellules isolées qui meurent par fragmentation","Premières manifestations : compaction de la chromatine et condensation du cytoplasme ; rétrécissement et condensation des cellules ; affaissement du cytosquelette ; fragmentation de la chromatine","Désagrégation de l’enveloppe nucléaire : le noyau se fragmente, chaque fragment est entouré d’une double enveloppe = corps apoptotiques (boursouflures), phagocytés notamment par des macrophages","Aucune réaction inflammatoire du tissu"]],["Nécrose",["Gonflement et éclatement de la cellule ; déversement du contenu cellulaire : inflammation"]],["Observation",["MET : condensation du noyau (cellule tumorale) ; MEB : cellule cancéreuse qui va mourir par apoptose"]]]},
{id:"apo3",t:"apo",a:0,r:AP,q:"Contrôle génétique de l’apoptose chez C. elegans : gènes ced, egl-1 et homologues ?",p:"p.7-10",s:[["Modèle C. elegans",["Ver nématode simple, génome connu : première identification de gènes de contrôle et d’exécution de la mort cellulaire programmée (Prix Nobel 2002)","Produit 1090 cellules somatiques et en détruit 131 par apoptose"]],["Gènes ced (cell death defective)",["Ordre d’intervention : ced-9, ced-4 puis ced-3 ; autres gènes : tra-1, egl-1, nuc-1 (dégradation)","Mutations perte de fonction : ced-9 : non viable, excès de mort ; ced-4 et ced-3 : viables, mort réduite","ced-9 doit diminuer son expression pour engager l’apoptose (inhibition du produit de ced-4) ; ced-4 favorise ced-3 ; ced-3 est directement responsable de la mort","EGL-1 se lie à CED-9 et l’inactive : CED-4 libéré s’oligomérise avec CED-3 et provoque son auto-activation"]],["Homologues chez les mammifères",["CED-3 = caspase (Cysteinyl aspartate protéase), homologue de la caspase 1 ; CED-9 = homologue de Bcl-2 (anti-apoptotique) ; CED-4 = homologue d’Apaf-1 (existe aussi chez les insectes et les vertébrés) ; EGL-1 = homologue des protéines pro-apoptotiques de la famille Bcl-2","Drosophile : Debcl, Buffy, Dark, caspases ; mammifères : Bid, Bad, Bax, Bak (pro), Bcl-2, Bcl-xL (anti), Apaf-1, caspases"]]]},
{id:"apo4",t:"apo",a:0,r:AP,q:"Les 3 phases de l’apoptose : induction, contrôle, exécution ?",p:"p.11",s:[["Induction",["Signal pro-apoptotique : privation en facteurs de croissance, stress, lésions de l’ADN, perforines des cellules immunitaires","Liaison à des récepteurs, médiation, signal intracellulaire de mort, activation d’enzymes dont certaines caspases"]],["Contrôle",["Protéines de la famille Bcl-2 : Bcl-2 anti-apoptotique, Bax pro-apoptotique"]],["Exécution",["Phase irréversible : caspases et mitochondrie"]]]},
{id:"apo5",t:"apo",a:4,r:AP,q:"Caspases : propriétés, initiatrices et effectrices, substrats ?",p:"p.12-13",s:[["Protéases ✪ à cystéine",["Coupent leurs cibles après un résidu aspartate ; résidu cystéine dans le site actif ✪✪✪ ; plus de 100 substrats identifiés"]],["Activation",["Présentes sous forme inactive ✪✪✪ dans les cellules vivantes ; précurseur inactif = procaspase ✪","Activation par des clivages réalisés par des aspartases"]],["Caspases initiatrices",["Monomères solubles inactifs dans le cytosol ; un signal apoptotique déclenche l’assemblage de plateformes protéiques : grands complexes où elles forment des dimères (activation, chaque caspase clive son partenaire)","Fonction principale : activer les caspases effectrices ✪","Chez les mammifères : caspases 2, 8, 9 et 10"]],["Caspases effectrices",["Dimères inactifs dans la cellule vivante ; leur clivage par une initiatrice réarrange le site actif (conformation active) : amplification de la cascade protéolytique ; elles clivent différentes protéines : mort de la cellule","Chez les mammifères : caspases 3 ✪✪, 6 ✪✪ et 7 ✪✪"]],["Quelques substrats",["Lamines nucléaires (lamina) : leur clivage permet la condensation et le bourgeonnement du noyau","Protéine qui maintient les endonucléases inactives : son clivage libère une endonucléase qui coupe l’ADN","Protéines du cytosquelette (ex : gelsoline) : modification de la morphologie de la cellule ; autres procaspases (activées à leur tour)"]]]},
{id:"apo6",t:"apo",a:3,r:AP,q:"Voies d’activation des caspases : extrinsèque (récepteurs de mort, Fas) et intrinsèque (mitochondrie) ?",p:"p.14-16",s:[["2 voies chez les mammifères",["Voie intrinsèque = voie mitochondriale ✪ ; voie extrinsèque = voie des récepteurs à domaine de mort","Chacune utilise sa propre caspase initiatrice et son propre complexe d’activation"]],["Voie extrinsèque",["Facteurs solubles de mort se fixent sur des récepteurs à domaine de mort (DD) : superfamille du TnfR (TRAIL, Fas, DR3, DR4, DR5)","Récepteurs transmembranaires : domaine extracellulaire de fixation du ligand, 1 domaine transmembranaire, domaine de mort intracellulaire (nécessaire pour activer l’apoptose)","Exemple de Fas : trimérisation par le ligand, recrutement de FADD, qui fixe des caspases initiatrices ✪✪ (surtout la procaspase 8) : complexe DISC (Death Inducing Signaling Complex)","Activation de la caspase 8 ✪ (et 10) : activation des caspases effectrices 3 et 7","Amplification : recrute la voie intrinsèque (la caspase 8 active Bid) ; régulation : certaines protéines (ex : Flip) sont anti-apoptotiques"]],["Voie intrinsèque",["Libération dans le cytosol de protéines mitochondriales de l’espace intermembranaire (stress, dommages de l’ADN)","Cytochrome c libéré : se fixe à APAF1 (Apoptotic Protease Activating Factor 1) qui s’oligomérise en apoptosome ; recrute la procaspase 9 : activation ; la caspase 9 active les caspases effectrices 3, 6 et 7","Les protéines de la famille Bcl-2 contrôlent la libération du cytochrome c, de AIF et de SMAC/Diablo : pro-apoptotiques la favorisent, anti-apoptotiques la bloquent","Anti-apoptotiques : ced-9, Bcl-2, Bcl-XL ; pro-apoptotiques : bax ✪ (augmentation de la perméabilité de la membrane mitochondriale externe) ; l’équilibre entre les deux classes décide de la vie ou de la mort"]]]},
