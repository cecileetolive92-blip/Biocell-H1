{"id":"endo1","t":"endo","a":4,"r":R3,"q":"Phagocytose : cellules, rôles et mécanisme ?","p":"p.3-5","s":[["Voie endocytaire (p.3)",["Entrée de macromolécules empaquetées dans des vésicules qui proviennent de l’invagination et de la séparation de fragments de la membrane plasmique","Phagocytose : transport de particules solides non dissoutes, de diamètre supérieur à 1 µm","Pinocytose : transport de solutés ✪ (soluté = molécule ou ion dissous dans un solvant)"]],["Cellules phagocytaires (p.4)",["Macrophages (macrophages résidents, macrophages inflammatoires) ; cellules dendritiques (même origine que les monocytes) ; polynucléaires neutrophiles","Cellules capables de phagocyter plusieurs particules simultanément"]],["Rôles dans l’élimination (p.4)",["De bactéries (participe aux mécanismes de défense de l’organisme) ; de cellules mortes ou sénescentes ; d’éléments dits étrangers","De dépôts de lipides dans les artères (processus normal tant que les quantités sont adaptées)","Élimination via le lysosome"]],["① Reconnaissance et fixation des particules à phagocyter (p.5)",["Les cellules phagocytaires reconnaissent des molécules à la surface des particules : des oligosaccharides et des phospholipides spécifiques des parois peuvent être reconnus comme des PAMPs (Pathogen-Associated Molecular Patterns) par des récepteurs des cellules phagocytaires ✪","De plus, des anticorps se fixent sur les particules : chaque anticorps a deux bras (Fab, partie variable) qui se fixent sur un épitope (protéine, polysaccharide, lipide) ; les cellules phagocytaires possèdent des récepteurs (Fcγ) qui reconnaissent la portion Fc de l’anticorps","Les deux mécanismes de reconnaissance peuvent agir indépendamment ou se combiner","La phagocytose est un mécanisme déclenché ✪"]],["② Saturation des récepteurs (p.5)",["Mise en place d’un processus sous la membrane plasmique de la cellule phagocytaire (ex : macrophage)","Rac (GTPase) stimule indirectement le complexe ARP2/3 : nucléation de nouvelles fibres d’actine à partir de fibres préexistantes, créant un réseau ramifié et dense","Lorsqu’elle est liée au GTP, Cdc42 (GTPase) favorise la polymérisation de l’actine en faisceaux parallèles : formation de fins prolongements = pseudopodes (« doigts »), qui viennent englober la particule","La myosine interagit ensuite avec les filaments d’actine et produit une contraction ; RhoA (petite protéine G) favorise cette contractilité"]],["③ Internalisation (p.5)",["La coordination entre polymérisation de l’actine, tension membranaire et contractilité contribue à refermer la coupe phagocytaire et à internaliser la particule dans un phagosome"]]],"n":"Page 5 : c’est le « tableau de remplacement » du poly qui est repris (la version « A remplacer » est ignorée)."},
{"id":"endo2","t":"endo","a":4,"r":R3,"q":"Pinocytose : sous-catégories et macropinocytose ?","p":"p.6","s":[["Pinocytose (p.6)",["Dans toutes les cellules eucaryotes ✪ : ingestion de particules dissoutes issues de l’environnement","Sous-catégories : macropinocytose ; pinocytose dépendant des clathrines ; pinocytose dépendant des cavéoles ✪ ; pinocytose indépendante des clathrines et des cavéoles"]],["Macropinocytose : souvent induite par un stimulus chimique",["Liaison d’un ligand à des récepteurs membranaires ; cascade de signalisation cellulaire avec activation des Rho : voie similaire à la phagocytose mais avec une distribution spatiale moins focalisée (taille de la vésicule augmentée)","Processus qui nécessite beaucoup d’énergie"]],["Formation de protrusions",["Formation d’une ou plusieurs protrusions ; formation de grosses vésicules appelées macropinosomes par réorganisation du cytosquelette d’actine ✪"]],["Rôles",["Capture de larges domaines de la membrane plasmique","Modification des capacités d’adhésion et de migration cellulaires (ex : la macropinocytose peut contribuer à l’endocytose des intégrines, qui assurent l’adhésion à la matrice extracellulaire : leur retrait de la membrane modifie les points d’ancrage de la cellule, ce qui peut permettre sa migration)","Présentation de l’antigène : capture d’un large volume de liquide extracellulaire incluant des protéines dont certaines peuvent être étrangères à l’organisme ; digestion et association des éléments étrangers au CMH de classe II (protéine membranaire) ; localisation à la surface de la cellule et présentation aux lymphocytes, ce qui va permettre la formation d’anticorps dirigés contre ces protéines étrangères"]]]},
{"id":"endo3","t":"endo","a":3,"r":R3,"q":"Pinocytose dépendant des clathrines et entrée du cholestérol (LDL) ?","p":"p.7-8","s":[["Pinocytose dépendant des clathrines (p.7)",["Mécanisme constitutif réalisé par tous les types cellulaires ; mécanisme de pinocytose le plus utilisé","Spécificité et sélectivité / capacité de tri : la clathrine permet d’internaliser et les adaptines reconnaissent des motifs précis (ex : LDL-R, EGFR)","Efficacité et rapidité : endocytose réalisée en quelques dizaines de secondes, de façon très organisée","Régulation de la signalisation : contrôle de la durée et de l’intensité du signal par recyclage ou dégradation de récepteurs membranaires","Polyvalence : absorption de nutriments (ex : LDL, fer via la transferrine) ; régulation de la signalisation ; renouvellement de récepteurs","Diamètre des vésicules de clathrine : 120 nm"]],["Formation de la vésicule (p.7)",["Vésicule qui comporte la clathrine, l’adaptine et un récepteur de chargement qui prend en charge la molécule dissoute à transporter","Détachement de la vésicule de la membrane plasmique grâce à la dynamine","Démantèlement rapide du manteau après la formation de la vésicule : poursuite du transport intracellulaire"]],["Exemple de l’entrée du cholestérol dans les cellules ✪✪ (p.8)",["Apport du cholestérol dans les cellules : pour le renouvellement des membranes biologiques ; pour assurer certaines synthèses issues du cholestérol (le cholestérol est le précurseur du cortisol)","Transport dans la circulation sanguine par des lipoprotéines : la LDL (Low Density Lipoprotein) permet, à partir du foie, de distribuer le cholestérol à tous les tissus périphériques (entrée dans les cellules par pinocytose) ; la HDL (high density lipoprotein) circule en sens inverse (tissus périphériques → foie)","Récepteur normal : la LDL avec le cholestérol se fixe sur le récepteur aux LDL ; le cholestérol associé à la LDL est ainsi endocyté dans une vésicule recouverte de clathrine : entrée sélective des LDL contenant du cholestérol ; adressage au lysosome où le cholestérol sera libéré","Récepteur anormal – hypercholestérolémie familiale : en présence de récepteurs aux LDL de conformation anormale, les LDL se fixent moins bien : moins d’internalisation des LDL","Conséquence : les LDL s’accumulent dans les vaisseaux, et s’y déposent créant une plaque d’athérome qui conduit à l’athérosclérose (obstruction des vaisseaux sanguins) ; l’excès de LDL associé à un taux de triglycérides trop élevé ne permet plus aux cellules phagocytaires d’éliminer ces dépôts de lipides ; risque d’infarctus du myocarde ou d’AVC"]]],"n":"Barré non repris (p.8) : « ou en cas de problème de nombre de récepteurs »."},
{"id":"endo4","t":"endo","a":2,"r":R3,"q":"Pinocytose dépendant des cavéoles et pinocytose indépendante des clathrines et des cavéoles ?","p":"p.9-10","s":[["Cavéoles : mécanisme alternatif (p.9)",["Souvent (mais pas exclusivement) au niveau de radeaux lipidiques : régions riches en cholestérol ✪, en sphingolipides ✪ et qui présentent des cavéolines ✪","La pinocytose cavéoline-dépendante est lente ; elle transporte des molécules spécifiques ✪","Diamètre des vésicules : 60 nm"]],["Formation des vésicules (p.9)",["Vésicules non recouvertes : insertion directe des cavéolines dans la membrane ; pas d’implication de la clathrine ni de l’adaptine","Intervention de la dynamine pour détacher la vésicule de la membrane plasmique (scission des cavéoles de la membrane plasmique)"]],["Devenir (p.9)",["Ne conduit pas toujours à une dégradation dans les lysosomes : il peut y avoir fusion des vésicules avec d’autres régions membranaires, comme par exemple la membrane plasmique opposée d’une cellule polarisée via transcytose","Voie utilisée pour certains virus (ex : SV40) ou toxines (ex : CTxB choléra toxine) : particules virales ou toxines endocytées adressées vers un endosome spécifique appelé cavéosome (centre de tri spécialisé pour les cavéoles)","L’adressage des vésicules implique le cytosquelette et les protéines Rab : interaction des vésicules avec les moteurs moléculaires (transport)","Dans le cas d’une infection virale, l’ADN viral est ensuite libéré dans le cytosol de la cellule infectée ce qui permet sa multiplication et la poursuite du cycle viral"]],["Pinocytose indépendante des clathrines et des cavéoles (p.10)",["Voie alternative, non spécifique (plusieurs types) ; voie rapide ; voie dépendante ou indépendante de la dynamine ; voie dépendante du cytosquelette ; diamètre des vésicules : 90 nm","Rôles : nutrition cellulaire (capture de nutriments et de solutés) ; régulation membranaire (renouvellement de la membrane plasmique)","Exemple de la voie CLIC/GEEC (Clathrin Independent Carriers/GPI-anchored-protein Enriched Early Endosomal Compartments) : permet le début du recyclage des ancres GPI ; intervention de Cdc42 et ARP2/3 vers l’intérieur de la cellule pour permettre l’invagination ; cargos : protéines ancrées par un GPI, phase liquide extracellulaire (la voie contribue à la pinocytose de fluide et de molécules dissoutes), certains glycolipides et toxines"]]],"n":"Barré non repris (p.9) : « Une même cellule peut présenter des vésicules avec de la cavéoline et des vésicules recouvertes de clathrine ». Page 10 : c’est le tableau de remplacement qui est repris."},
{"id":"endo5","t":"endo","a":4,"r":R3,"q":"Voie endosomale : endosome précoce (= tri) et endosome de recyclage ?","p":"p.11-12","s":[["Devenir des vésicules d’endocytose (p.11)",["Les vésicules d’endocytose formées convergent vers l’endosome précoce = endosome de tri","L’endosome de tri accueille transitoirement le contenu des différentes vésicules d’endocytose : les vésicules endosomales s’intègrent dans le trafic intracellulaire du réseau endomembranaire ; pH physiologique d’environ 7,4"]],["Endosome de recyclage (p.11)",["L’endosome précoce est capable de réaliser un tri des particules endocytées pour assurer un recyclage de certaines d’entre-elles : retour à la membrane plasmique via l’endosome de recyclage ✪✪"]],["Retour des récepteurs aux LDL à la membrane plasmique (p.12)",["La LDL liée au récepteur aux LDL est endocytée dans une vésicule recouverte de clathrine","Le récepteur aux LDL est ramené à la membrane plasmique via l’endosome précoce et l’endosome de recyclage","Le recyclage des récepteurs est plus long que celui de la clathrine : la clathrine est présente à l’extérieur de la vésicule et repart donc directement lorsque le manteau se dissocie, alors que les récepteurs doivent transiter par les endosomes"]]]},
{"id":"endo6","t":"endo","a":2,"r":R3,"q":"Endosome tardif et corps multivésiculaires ?","p":"p.14","s":[["Corps multivésiculaires ✪",["Se forment par invagination de la membrane de l’endosome précoce","Des protéines particulières sont empaquetées sélectivement dans ces sous-vésicules grâce à des ubiquitines : tri dans un corps multivésiculaire lorsqu’une protéine membranaire (ou un ARN, un lipide) est mono-ubiquitinée (= attachée à une molécule d’ubiquitine)","Les corps multivésiculaires sont un des marqueurs de maturation de l’endosome précoce en endosome tardif"]],["Endosome tardif",["Fusion des corps vésiculaires avec des endosomes tardifs ✪ préexistants possible","Communication avec le réseau trans-golgien : des lipides et des protéines dont des enzymes lysosomiales sont apportés à l’endosome tardif depuis le réseau trans-golgien ✪","pH de 6,5 : début d’acidification du pH par rapport à l’endosome de tri","Marqueurs de l’endosome tardif : Rab7 ; LAMP1 (protéine glycosylée, marqueur de destination lysosomale) ; l’ubiquitinylation constitue un marqueur plus spécifique que certains marqueurs de surface"]],["Destination finale",["Dégradation : fusion avec un lysosome","Libération : certaines vésicules internes deviennent des exosomes libérés à l’extérieur de la cellule (voie d’évitement lysosomal ; cette voie peut être utilisée pour libérer certains médicaments après élimination des nanoparticules qui les englobaient)"]]]},
{"id":"endo7","t":"endo","a":2,"r":R3,"q":"Lysosome : composition, formation, marquage ?","p":"p.15","s":[["Composition du lysosome",["Composants de la lumière : hydrolases acides impliquées dans la digestion de molécules","Composants membranaires : glycoprotéines non enzymatiques telles que les protéines LAMP ; glycoprotéines enzymatiques telles que la phosphatase acide ; perméases (ex : sortie du cholestérol) ; pompes à H⁺ (déjà présentes au niveau de l’endosome tardif mais n’y fonctionnent pas à pleine vitesse)"]],["Formation du lysosome",["Le lysosome provient de l’endosome tardif, et d’éléments apportés à partir de l’appareil de Golgi au niveau de l’endosome tardif, entre l’endosome tardif et le lysosome, ou juste avant l’endosome tardif","Les vésicules trans-golgiennes permettent un apport de protéines (enzymes) et de lipides au lysosome, notamment un apport de protéines spécifiques au lysosome, telles que les hydrolases : cet apport nécessite un signal d’adressage spécifique (glycosylations ✪)"]],["Marquage du lysosome",["Le lysosome peut être mis en évidence à l’aide d’un LysoTracker"]]],"n":"Page 15 : c’est le tableau de remplacement qui est repris."},
{"id":"endo8","t":"endo","a":1,"r":R3,"q":"Adressage des hydrolases au lysosome (mannose 6-phosphate) ?","p":"p.16","s":[["Rôle des glycosylations",["Le signal d’adressage au lysosome est un oligosaccharide (N-lié) qui se termine par un mannose 6-phosphate","L’hydrolase glycosylée est une molécule soluble : son empaquetage dans la vésicule trans-golgienne nécessite donc qu’elle soit associée à un récepteur de chargement, qui reconnaît spécifiquement le mannose 6-phosphate"]],["Mécanisme",["Le récepteur de chargement associé à l’hydrolase glycosylée est reconnu par une adaptine, qui présente elle-même des domaines de reconnaissance avec les molécules de clathrine","Après fusion de la membrane de la vésicule trans-golgienne et de la membrane de l’endosome tardif/du jeune lysosome, l’hydrolase est libérée dans la lumière de l’endosome tardif/du jeune lysosome","Le pH acide de l’endosome tardif/du jeune lysosome permet de dissocier l’enzyme du récepteur au mannose-6P : le récepteur de chargement est ensuite recyclé dans des vésicules de retour vers l’appareil de Golgi ; le phosphate du mannose-6P est retiré par une phosphatase afin d’obtenir une hydrolase glycosylée mature"]]]},
{"id":"endo9","t":"endo","a":1,"r":R3,"q":"GLUT4 et transcytose ?","p":"p.13","s":[["Transcytose : transport d’une membrane à une autre dans les cellules polarisées",["Depuis les vésicules issues de la pinocytose, transport vers l’endosome de tri puis l’endosome de recyclage jusqu’à atteindre la membrane opposée de la cellule polarisée : mécanisme non spécifique d’un type de pinocytose","Exemple des immunoglobulines G (IgG) maternelles dans les cellules trophoblastiques (placentaires) : le système immunitaire du fœtus étant immature, le mécanisme de transcytose permet le transfert des IgG maternelles vers le fœtus dès le 2ème trimestre de grossesse","Les immunoglobulines maternelles sont endocytées sur la face maternelle de la cellule trophoblastique ; elles sont véhiculées jusqu’à l’endosome précoce, l’endosome de recyclage, puis la membrane basale côté fœtal","Par ce phénomène de transcytose, le transfert continu des immunoglobulines G permet de protéger le fœtus au cours de la grossesse"]],["GLUT4",["Après passage par l’endosome de tri et l’endosome de recyclage, les transporteurs du glucose GLUT4 sont stockés dans des vésicules à proximité de la membrane plasmique jusqu’à l’arrivée d’un signal insuline","Lorsque l’insuline se fixe à un récepteur spécifique, les transporteurs GLUT4 sont transloqués à la membrane plasmique pour assurer l’entrée du glucose","Remarque : dans d’autres exemples, les vésicules d’endocytose peuvent être stockées sous la membrane plasmique sans passer par l’endosome de tri et l’endosome de recyclage"]]],"n":"Page 13 : c’est le tableau de remplacement qui est repris."},
{"id":"endo10","t":"endo","a":1,"r":R3,"q":"Digestion par le lysosome : Rab5/Rab7, phagolysosome, explosion oxydative ?","p":"p.17","s":[["Points communs entre pinocytose dépendant des clathrines et phagocytose",["Recrutement de Rab5 sur la membrane grâce à des GEF (Rab5-GTP) : membrane de l’endosome de tri dans le cas de la pinocytose","Rab5-GTP recrute ses effecteurs dont le GEF de Rab7 : accumulation du GEF de Rab7 dans la membrane (permet l’échange GDP→GTP au niveau de Rab7)","Arrivée de Rab7-GTP sur la membrane : libération de Rab5 par la GAP de Rab5 (échange GTP→GDP)"]],["La phagocytose",["Intervention des petites protéines G dont Rab7 ✪","Fusion du phagosome avec un lysosome existant pour former un phagolysosome","Les macrophages et les neutrophiles détruisent le contenu du phagolysosome par explosion oxydative (H₂O₂) : activation de l’enzyme NADPH oxydase (phosphorylation) ; la NADPH oxydase transfère des électrons de NADPH vers l’oxygène, ce qui permet la formation de peroxydes d’hydrogène (H₂O₂) ; destruction des membranes bactériennes, des protéines, de l’ADN"]]],"n":"Barré non repris : « Rab7-GTP active la GAP de Rab5 »."},
{"id":"endo11","t":"endo","a":3,"r":R3,"q":"Exocytose : voie constitutive et voie régulée ?","p":"p.19-20","s":[["Définition (p.19)",["L’exocytose ou voie sécrétoire met en jeu les vésicules trans-golgiennes recouvertes de clathrine, qui vont fusionner avec la membrane plasmique pour sécréter leur contenu dans le milieu extracellulaire","2 voies : la voie de sécrétion constitutive et la voie de sécrétion régulée"]],["Voie constitutive (p.19)",["Dans toutes les cellules ; apport de lipides et de protéines à la membrane plasmique ; apport de nouveaux composants à la matrice extracellulaire (ex : protéoglycanes)","Pas de signal d’adressage","Fusion dès que la vésicule arrive à proximité de la membrane plasmique : le cytosquelette permet à la vésicule d’aller jusqu’à la membrane plasmique"]],["Voie régulée (p.19)",["Dans les cellules sécrétrices ; fusion entre la membrane de la vésicule et la membrane plasmique déclenchée par un signal extracellulaire (potentiel d’action ; fixation d’un ligand sur un récepteur ; ex : insuline, neurotransmetteurs, Ca²⁺)","Nécessite un signal d’adressage ; maturation des vésicules de sécrétion"]],["Maturation des vésicules de sécrétion (p.20)",["Agrégation des molécules à sécréter : fusion de plusieurs vésicules ce qui permet une concentration ✪ des éléments contenus dans les vésicules","Acidification de la vésicule de sécrétion : création d’interactions faibles entre les protéines suite à la diminution de pH → rapprochement des éléments transportés dans la vésicule","Recyclage de la clathrine","Maturation des molécules transportées (phénomène non obligatoire) : certaines protéines sécrétées sont synthétisées sous forme de précurseurs (ex : pro-hormones) et subissent une maturation par protéolyse dans les vésicules avant leur sécrétion"]],["Libération des vésicules de sécrétion – exemple du calcium (p.20)",["Signal extracellulaire tel qu’un potentiel d’action : ouverture d’un canal calcique permettant l’entrée de calcium dans la cellule","Liaison du calcium avec la synaptotagmine des vésicules situées à proximité de la membrane (la synaptotagmine n’est pas une Rab mais elle joue un rôle similaire pour favoriser l’interaction entre la v-SNARE et la t-SNARE)","Enroulement des SNAREs permettant l’évacuation de l’eau entre la membrane de la vésicule et la membrane plasmique","Fusion entre la vésicule et la membrane plasmique : libération du contenu de la vésicule à l’extérieur de la cellule"]]]},
{"id":"endo12","t":"endo","a":0,"r":R3,"q":"Autophagie : étapes et rôles ?","p":"p.18","s":[["Étapes",["① Détection d’un problème au niveau de la cellule ou d’un besoin : composants abîmés (organites défectueux, protéines mal repliées) ; manque de nutriments","② Formation d’une membrane isolante à partir du Golgi et du RE, voire des endosomes : membrane appelée phagophore qui se forme dans la cellule et entoure le « déchet »","③ Création de l’autophagosome : le phagophore se ferme ce qui permet la formation de l’autophagosome ; LC3 est un marqueur classique des autophagosomes (= Atg8 chez la levure)","④ Fusion avec le lysosome : l’autophagosome fusionné avec le lysosome devient un autolysosome","⑤ Dégradation et recyclage : dans le cas d’une mitochondrie, dégradation des membranes mitochondriales puis de l’intérieur de la mitochondrie ; recyclage : acides gras, acides aminés"]],["Rôles de l’autophagie",["Éviter l’accumulation de déchets toxiques ; favoriser la survie en période de stress ou de famine"]]],"n":"Barré non repris : « La fusion entraîne une augmentation du pH du lysosome. Le fonctionnement des pompes à protons permet de faire rediminuer le pH. »"},

const ANIM=[];
function setAn(root,s){
 root.querySelectorAll('[data-v],[data-m],[data-f]').forEach(e=>{
  const d=e.dataset;
  if(d.v){const[a,b]=d.v.split('-').map(Number);e.style.opacity=(s>=a&&s<=b)?1:0}
  const kf=(str)=>{let r=null;str.split('|').forEach(p=>{const i=p.indexOf(':'),k=+p.slice(0,i);if(k<=s)r=p.slice(i+1)});return r};
  if(d.m){const r=kf(d.m);if(r!==null){const q=r.split(',').map(Number);e.style.transform=`translate(${q[0]||0}px,${q[1]||0}px)`+(q.length>2?` rotate(${q[2]}deg)`:'')}}
  if(d.f){const r=kf(d.f);if(r!==null)e.style.fill=r}
 })}
function anim(k,id){

 return `<button class="btn" onclick="go('th','${k}')">← Retour au chapitre</button><h2 style="margin-top:12px">${esc(A.t)}</h2><span class="mu">Animation · ${esc(A.p)}</span>
 <div class="card an"><div id="anv" onclick="anGo(1)">${A.svg}</div>${A.leg?`<div class="lg">${A.leg.map(([c,t])=>`<span><i style="background:${c}"></i>${esc(t)}</span>`).join("")}</div>`:""}<div id="ancap" class="ancap"></div><div id="andots" class="row" style="justify-content:center;gap:6px;margin:8px 0"></div>
 <div class="row"><button class="btn" onclick="anGo(-1)">← Précédent</button><button class="btn p" id="annext" onclick="anGo(1)">Suivant →</button></div></div>`;
}
function anShow(){
 const A=ANIM.find(x=>x.id==V.id),n=A.steps.length;
 const rt=document.getElementById('anv');if(!rt.dataset.i){rt.classList.add('nt');setAn(rt,V.s);void rt.offsetWidth;rt.classList.remove('nt');rt.dataset.i=1}else setAn(rt,V.s);
 document.getElementById('ancap').innerHTML=`<b>${V.s+1}/${n}</b> · ${esc(A.steps[V.s])}`;
 document.getElementById('andots').innerHTML=A.steps.map((_,i)=>`<i class="dot${i==V.s?' on':''}" onclick="V.s=${i};anShow()"></i>`).join('');
 const b=document.getElementById('annext');b.textContent=V.s==n-1?'↺ Recommencer':'Suivant →';
}
function anGo(d){const A=ANIM.find(x=>x.id==V.id),n=A.steps.length;if(V.s==n-1&&d>0)V.s=0;else V.s=Math.max(0,Math.min(n-1,V.s+d));anShow()}

steps:[
"Deux voies chez les mammifères : la voie extrinsèque (récepteurs à domaine de mort) et la voie intrinsèque (mitochondriale). Chacune utilise sa propre caspase initiatrice et son propre complexe d’activation.",
"Voie extrinsèque : le ligand (ex : FasL) se fixe sur les récepteurs à domaine de mort (superfamille du TnfR : Fas, TRAIL, DR3-5) et provoque leur trimérisation.",
"Le domaine de mort intracellulaire recrute FADD, qui fixe des caspases initiatrices (surtout la procaspase 8) : complexe DISC (Death Inducing Signaling Complex).",
"Les procaspases 8 s’activent dans le DISC (caspase 8 ✪). La caspase 8 active les caspases effectrices 3 et 7. (Amplification possible : la caspase 8 active Bid, qui recrute la voie intrinsèque.)",
"Voie intrinsèque : stress, dommages de l’ADN. Bax/Bak (pro-apoptotiques) se transloquent et s’agrègent dans la membrane mitochondriale externe, ce qui libère le cytochrome c dans le cytosol. Les anti-apoptotiques (Bcl-2, Bcl-XL) bloquent cette libération.",
"Le cytochrome c se fixe à APAF1, qui s’oligomérise en apoptosome et recrute la procaspase 9 : activation de la caspase 9, qui active les caspases effectrices 3, 6 et 7.",
"Les deux voies convergent vers les caspases effectrices 3, 6 et 7 : elles clivent les lamines nucléaires (condensation et bourgeonnement du noyau), libèrent une endonucléase qui coupe l’ADN, clivent des protéines du cytosquelette (gelsoline) : mort de la cellule."],

const tog=id=>{S.vu[id]=!S.vu[id];sv();render()};
function home(){

 return `<h1>Biocell – fiches prioritaires</h1><p class="mu">Classées par fréquence des thèmes dans les annales (QCM de biologie cellulaire : 2019-20, 2021 session 1 et 2, 2021-22). Les exercices d’expériences (6 QCM par sujet) reviennent à chaque fois.</p>
 <div class="card"><b>${d}/${n}</b> fiches prêtes vues<div class="bar"><i style="width:${100*d/n}%"></i></div></div>
 ${TH.map((t,i)=>`<div class="card tap" onclick="go('th','${t.k}')"><div class="row"><b>${i+1}. ${esc(t.n)}</b><span class="mu">${t.c} QCM / 4</span></div><div class="bar"><i style="width:${100*t.c/max}%"></i></div><span class="tag ${ST[t.st][1]}">${ST[t.st][0]}</span></div>`).join("")}
 <p class="mu">★ = fréquence dans les 4 annales : ★★★★ tombe à chaque fois, ★★★ 3 fois sur 4, ★★ 2 fois sur 4, ★ 1 fois, ☆☆☆☆ pas vu dans les QCM (hors exercices). ✪ = notion tombée 1 / 2 / 3 fois ou plus au concours (comme sur les fiches de la prépa). Seules les parties au programme sont reprises (passages barrés exclus). Les numéros de page sont ceux imprimés sur les fiches de la prépa (les tableaux de remplacement ou « à insérer » n’ont pas de numéro).</p>`;
}
function th(k){
 const t=TH.find(x=>x.k==k),fs=F.filter(f=>f.t==k).sort((x,y)=>y.a-x.a),ph=PH[k]||[];
 return `<button class="btn" onclick="go('home')">← Priorités</button><h2 style="margin-top:12px">${esc(t.n)}</h2><p class="mu">Annales : ${esc(t.an)}</p>
 ${fs.map(f=>`<div class="card tap" onclick="go('f','${k}','${f.id}')"><div class="row"><b>${esc(f.q)}</b><span>${S.vu[f.id]?"✓":""}</span></div><span class="mu">Poly ${esc(f.p)}</span> · ${ST4(f.a)}</div>`).join("")}
 ${ANIM.filter(a=>a.k==k).length?'<h3>Animations (clique pour avancer)</h3>'+ANIM.filter(a=>a.k==k).map(a=>`<div class="card tap" onclick="go('an','${k}','${a.id}')"><b>▶ ${esc(a.t)}</b><br><span class="mu">${a.steps.length} étapes · ${esc(a.p)}</span></div>`).join(''):''}
 ${ph.map(q=>`<div class="card ph"><b>${esc(q)}</b><br>${ST4(PHA[q])} <span class="tag wt">${t.st=="recu"?"Cours reçu · fiche à venir":"À remplir dès réception du cours"}</span></div>`).join("")}`;
}
function fiche(id){
 const f=F.find(x=>x.id==id);
 return `<button class="btn" onclick="go('th','${f.t}')">← Retour</button><h2 style="margin-top:12px">${esc(f.q)}</h2><span class="mu">${f.r||SRC}, ${esc(f.p)}</span><br>${ST4(f.a)}${f.n?`<p class="mu">${esc(f.n)}</p>`:""}
 <div class="card">${f.s.map(([h,l])=>`<h3>${esc(h)}</h3><ul>${l.map(x=>x[0]=="–"?`<li class="s">${esc(x.slice(2))}</li>`:`<li>${esc(x)}</li>`).join("")}</ul>`).join("")}</div>
 <button class="btn ${S.vu[id]?"":"p"}" onclick="tog('${id}')">${S.vu[id]?"✓ Fiche vue (retirer)":"Marquer comme vue"}</button>`;
}
function render(){document.getElementById("app").innerHTML=V.v=="home"?home():V.v=="th"?th(V.k):V.v=="an"?anim(V.k,V.id):fiche(V.id);if(V.v=="an")anShow()}
