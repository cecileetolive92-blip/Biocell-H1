{id:"apo7",t:"apo",a:3,r:AP,q:"Famille Bcl-2 : domaines BH, Bax et Bak, activation ?",p:"p.16-17",s:[["Domaines d’homologie BH",["4 domaines BH ✪ (BH1, BH2, BH3 ✪ et BH4) : anti-apoptotiques (ex : Bcl-2, Bcl-XL)","3 domaines BH (BH1, BH2 et BH3 ✪✪) : effectrices pro-apoptotiques (ex : Bax, Bak ✪)","1 seul domaine BH « BH3 only » ✪ : pro-apoptotiques ✪ (ex : Bid, Bad, Bim, Puma, Noxa)"]],["En présence d’un stimulus apoptotique",["Agrégation dans la membrane mitochondriale externe : libération du cytochrome c et du facteur AIF dans le cytosol","Bax et Bak sont les principales protéines effectrices ; sans signal, Bax est cytosolique et se transloque dans la mitochondrie après activation par un signal pro-apoptotique (changement de conformation)"]]]},
{id:"apo8",t:"apo",a:3,r:AP,q:"Moyens d’étude de l’apoptose : DAPI, TUNEL, annexine V, iodure de propidium ?",p:"p.18",s:[["Étude morphologique",["Marqueurs fluorescents nucléaires (ex : DAPI) : noyaux ronds réguliers ou noyaux irréguliers et fragmentés (apoptose) ; marquage peu spécifique de l’apoptose"]],["TUNEL",["Met en évidence la fragmentation de l’ADN par des endonucléases : marquage vert des extrémités 5’ et 3’ des fragments (terminal transférases) ; fragmentation = grand nombre d’extrémités : TUNEL positif"]],["Annexine V et iodure de propidium (cytométrie en flux)",["Annexine V : visualise les phosphatidylsérines exposées côté extracellulaire pendant l’apoptose (remaniement de la membrane)","Iodure de propidium : pénètre seulement dans les cellules perméabilisées : distingue apoptose et nécrose","Cellules vivantes : ni annexine V ni iodure de propidium ; apoptotiques : annexine V ✪ mais pas d’iodure de propidium ; nécrotiques : annexine V ✪ et iodure de propidium"]]]},
{"id":"cyc1","t":"cycle","a":4,"r":CC,"q":"Cycle cellulaire : définition, rôles, grandes phases ?","p":"p.3-5","s":[["Définition",["Ensemble des modifications par lesquelles une cellule mère se divise en deux cellules filles, ayant les mêmes caractères morphologiques et physiologiques que la cellule mère","Processus par lequel une cellule se développe, duplique son ADN et se divise pour former deux nouvelles cellules"]],["Rôles",["Croissance : passage du stade embryonnaire au stade adulte ; augmenter le nombre de cellules en maintenant la même quantité d’ADN par cellule","Renouvellement : durée de vie variable selon le type cellulaire (120 jours pour le globule rouge, 15 jours pour les cellules de la peau)","Réparation tissulaire : cicatrisation","Régulation : équilibre entre formation de nouvelles cellules et mort cellulaire ; une régulation défaillante peut être à l’origine de cancers"]],["Taux de renouvellement variable",["Pas de division pour les cellules nerveuses et musculaires","1 fois par an pour un hépatocyte","2 fois par jour pour les cellules de la muqueuse intestinale"]],["Cycle des cellules somatiques",["Cellule mère : chromosomes composés d’une seule chromatide = « chromosomes simples »","Réplication de l’ADN pour obtenir des chromosomes à deux chromatides ✪ = « chromosomes doubles » ; le nombre de chromosomes ne change pas","Mitose : séparation des chromatides de chaque chromosome, formation de deux cellules filles ; chaque cellule fille a la même information génétique que la cellule mère","Caractéristiques universelles de la division : réplication de l’ADN et doublement de la masse cellulaire"]],["Les étapes",["Cycle cellulaire = interphase + phase M","Interphase : phases G1 ✪, S ✪ et G2 ✪","Phase M = mitose + cytodiérèse ; mitose = prophase + prométaphase + métaphase + anaphase + télophase ; la phase M correspond à la division cellulaire (noyau + cytoplasme)","Cycle eucaryote : G1, S, G2, M ; cycle procaryote : phases B (G1), C (S) et D (cytocinèse)"]]]},
{"id":"cyc2","t":"cycle","a":4,"r":CC,"q":"Interphase : que se passe-t-il en G1, S et G2 ? Durée des phases ?","p":"p.6, 20","s":[["Interphase",["Plus longue période du cycle : entre la fin d’une division et le début de la suivante","Période de duplication des composants cellulaires pour donner 2 cellules filles identiques"]],["G1 (Gap1)",["Phase de croissance cellulaire","Synthèse de protéines nécessaires et préparation à la réplication","Forte activité métabolique avec une augmentation de la taille de la cellule"]],["S (Synthèse)",["Duplication de l’ADN ✪ : passage de 2n à 4n chromosomes","Duplication du centrosome ✪✪✪"]],["G2 (Gap2)",["Phase prémitotique","Phase de croissance cytoplasmique, avec préparation à la mitose","Expression des protéines de condensation de la chromatine","Vérification de la bonne duplication de l’ADN et réparation d’éventuelles erreurs"]],["Durée (cellule humaine : environ 24 h)",["G1 : 11 h ; S : 8 h ; G2 : 4 h ; M : 1 h","Durée variable selon l’espèce et selon le type de cellule","La phase G1 est la phase dont la durée est la plus longue et la plus variable ✪"]]]},
{"id":"cyc3","t":"cycle","a":4,"r":CC,"q":"Centrosome : structure, rôles et duplication au cours du cycle ?","p":"p.6-7","s":[["Rôles",["Centre directeur de l’organisation des microtubules : nucléation à partir du centre organisateur des microtubules (COMT)","Détermine la mobilité, l’adhésion et la polarité de la cellule","Rôle clé dans la ségrégation des chromosomes pendant la division : le fuseau mitotique est formé de microtubules qui s’organisent autour du centrosome"]],["Structure",["Deux centrioles perpendiculaires l’un à l’autre, entourés d’une matrice péricentriolaire","Centriole = 9 triplets de microtubules : microtubules internes complets, médians et externes incomplets"]],["Particularité",["Les cellules végétales ne possèdent pas de centrosome : organisation des microtubules au niveau des pôles du fuseau mitotique, sans centrosome"]],["Duplication",["Début de G1 : un seul centrosome composé de deux centrioles","Phase S : réplication de chaque centriole, produisant un nouveau centriole (« fille ») près de chaque centriole existant (« mère ») ; protéines impliquées : PLK4 (polo-like kinase 4), SAK, Mps1","Phase G2 : maturation des centrioles nouvellement formés ; protéines : PLK1 (polo-like kinase 1), Aurora1, Nek2 (rôle dans la séparation des deux centrosomes)","G2 : développement de la matrice péricentriolaire (augmente la capacité des centrosomes à organiser les microtubules)","G2 : début de séparation des deux centrosomes juste avant la mitose ; migration vers des pôles opposés de la cellule","Chaque nouveau centrosome constitue un aster (faisceau de microtubules rayonnant à partir d’un COMT) : prolifération et déplacement de chaque côté du noyau, initiation de la formation des deux pôles du fuseau"]]]},
{"id":"cyc4","t":"cycle","a":4,"r":CC,"q":"Phase M : les phases de la mitose et la cytodiérèse, qu’est-ce qui change à chaque étape ?","p":"p.7-8, 12-13, 15, 17-18","s":[["Phase M",["Finalité : séparation et ségrégation exacte des chromosomes préalablement répliqués","3 événements majeurs : condensation des chromosomes (permet leur ségrégation), mise en place du fuseau mitotique, mise en place de l’anneau contractile (séparation des 2 cellules filles)","Mitose en 5 phases principales + cytodiérèse (division cytoplasmique, scission des deux cellules filles identiques)"]],["Prophase (p.12)",["Début de condensation de la chromatine en structure ordonnée : les chromosomes ; diminution de taille du nucléole puis disparition","Séparation des centrosomes","Réorganisation du cytosquelette de microtubules pour former le fuseau mitotique : structure bipolaire qui s’étend entre les deux centrosomes","Kinétochores : complexes protéiques spécialisés qui se forment au niveau des centromères ; les deux chromatides sont liées aux kinétochores par des cohésines"]],["Prométaphase (p.13)",["Fragmentation de l’enveloppe nucléaire ✪ : disparition du réseau de lamines nucléaires","Libération des chromosomes dans le cytoplasme : ils deviennent accessibles aux microtubules","Attachement des chromatides sœurs de chaque chromosome à des microtubules du fuseau par leur kinétochore ✪"]],["Métaphase (p.15)",["Alignement de tous les chromosomes sur la plaque équatoriale du fuseau (= plaque métaphasique)","Condensation maximale des chromosomes","Attachement des microtubules aux kinétochores : tirage équilibré sur les chromatides sœurs qui permet de les maintenir en place ; stabilité du fuseau mitotique"]],["Anaphase (p.17)",["Séparation des chromatides sœurs : rupture des cohésines","Anaphase A : les chromatides sœurs sont tirées vers les pôles opposés grâce au raccourcissement des microtubules kinétochoriens (forces générées par la dépolymérisation des microtubules et l’action de protéines motrices : kinésines, dynéines)","Anaphase B : les pôles du fuseau s’éloignent l’un de l’autre en raison de l’allongement des microtubules polaires, ce qui contribue à l’étirement de la cellule (allongement du fuseau mitotique)"]],["Télophase (p.18)",["Début de la télophase : reconstitution de l’enveloppe nucléaire ✪ autour de chaque ensemble de chromosomes, et réapparition du nucléole ✪","Arrêt de migration des chromosomes qui parviennent aux pôles du fuseau","Décondensation des chromosomes (permet l’accessibilité pour la transcription)","Déphosphorylation de nombreuses protéines dont la lamine de la membrane nucléaire","Division du cytoplasme : commence avec la formation de l’anneau contractile ; chevauchement de la cytodiérèse et de la télophase"]]]},
{"id":"cyc5","t":"cycle","a":4,"r":CC,"q":"Cohésines et condensines : rôles, composition, différences ?","p":"p.9-11","s":[["Rôles (p.9)",["Les deux principaux complexes protéiques qui interviennent dans la condensation des chromosomes","Les cohésines maintiennent les chromatides sœurs ensemble et assurent leur cohésion","Les condensines facilitent l’enroulement de l’ADN autour d’elles : augmentation de la condensation des chromosomes ✪ de 50 fois","Les condensines et les cohésines de la mitose ne sont pas les mêmes que celles de la méiose ✪✪"]],["Structure commune (p.9)",["Structure similaire ✪ ; fonctionnement simultané","Composées de protéines Smc (Structural Maintenance of Chromosomes) : complexes qui enroulent l’ADN et permettent de maintenir la cohésion des chromatides (cohésines) ou de condenser les chromosomes (condensines)"]],["Cohésines (p.10)",["Composées de quatre sous-unités ✪ (tétramère ✪) : Smc1, Smc3, Scc1 et Scc3","Smc1 et Smc3 forment un pont qui finit par une charnière (hinge) ; bras formés d’hélices α (coiled-coil) ; l’ensemble se termine par un domaine ATPase","Scc1 (= Rad21) relie les têtes ATPase de Smc1 et Smc3 et ferme l’anneau ; Scc3 se fixe sur Scc1 ; l’ensemble forme un anneau qui entoure les chromatides sœurs","Après la réplication : distribution tout le long du chromosome, du télomère au centromère ; densité maximale au niveau du centromère","En prophase, les cohésines des bras sont retirées ; seules les cohésines centromériques restent, protégées par la shugoshine, jusqu’à leur clivage par la séparase à l’anaphase","Cellules sans cohésine (ΔCohesin) : échec de la ségrégation des chromosomes ou répartition inégale des chromatides (ΔMock = témoin, séparation correcte)"]],["Condensines (p.11)",["Composées de cinq sous-unités ✪✪ : 2 protéines Smc, Smc2 et Smc4 ✪, et 3 sous-unités supplémentaires (condensine I) : CAP-H, CAP-G et CAP-D2","Charnière et brins surenroulés se terminant par un domaine ATPase ; CAP-H relie les têtes ATPase et ferme l’anneau ; CAP-G et CAP-D2 se fixent sur CAP-H","Forment aussi des anneaux, mais leur fonction principale est la condensation des chromosomes plutôt que la cohésion : elles se fixent le long de l’axe des chromatides et compactent l’ADN en formant des boucles (modèle d’extrusion de boucles)","Activation en début de mitose : par phosphorylation, via des M-Cdk","Cellules HeLa appauvries en condensines (siARN CAP-D2/3 ou Smc2) : défaut de condensation des chromosomes (chromosomes condensés dans les cellules contrôles)"]]]},
{"id":"cyc6","t":"cycle","a":3,"r":CC,"q":"Kinétochore et fuseau mitotique : structure et types de microtubules ?","p":"p.14, 16","s":[["Kinétochores (p.14)",["Formés au niveau du centromère de chaque chromatide sœur : un chromosome dupliqué possède 2 kinétochores positionnés dos à dos","CCAN (≈ 16 protéines CENP) forme la base du kinétochore ; CENP-A (variante d’histone H3) marque le centromère","Kinétochore interne : étroitement lié à l’ADN centromérique, reste associé aux chromosomes tout au long du cycle","Kinétochore externe : s’assemble au début de la mitose et interagit avec les microtubules du fuseau mitotique (complexe Ndc80) ; domaine responsable de l’attachement aux microtubules ; régulé dynamiquement pendant la mitose"]],["Fuseau mitotique (p.16)",["Formation à partir des microtubules qui émergent des centrosomes","Microtubules kinétochoriens ✪ : s’attachent aux kinétochores ✪ des chromosomes, facilitant leur mouvement","Microtubules polaires (= chevauchants ✪) : partent de chaque pôle et se chevauchent au centre du fuseau, sans s’attacher aux chromosomes ; stabilisent le fuseau et écartent les pôles","Microtubules astraux ✪ : se dirigent vers la membrane cellulaire, participant au positionnement et à l’orientation du fuseau","Rôle : séparation des chromatides sœurs (chromosome répliqué ✪) vers les pôles opposés de la cellule ; mouvements assurés par des moteurs moléculaires : kinésines et dynéines","Anomalies : mauvaise répartition des chromosomes à l’origine d’aneuploïdies","Cible de traitements anticancéreux : taxanes (ex : paclitaxel) qui stabilisent les microtubules et bloquent la division cellulaire"]]],"n":"Barré non repris : CENP-B (p.14)."},
{"id":"cyc7","t":"cycle","a":3,"r":CC,"q":"Cytodiérèse : anneau contractile, sillon de division, mid-body ?","p":"p.19","s":[["Terminologie",["Cytodiérèse = cytokinèse = cytocinèse"]],["Anneau contractile",["Constitué de myofilaments d’actine et de myosine II ✪","Étapes : spécification de la localisation du plan de clivage, invagination de la membrane plasmique à l’équateur, formation d’un pont intercellulaire, abscission des deux cellules sœurs","Sillon de division : formé dans un plan perpendiculaire à l’axe du fuseau mitotique ; se resserre jusqu’à former un corps intermédiaire (passage étroit entre les deux cellules filles qui contient le reste du fuseau mitotique)","Contraction de l’anneau : permet la séparation physique des deux cellules filles"]],["Mid-body",["Formation au centre du fuseau mitotique résiduel, entre les deux cellules filles en cours de séparation","Composé des microtubules chevauchants du fuseau central, comprimés par l’anneau contractile, et d’une matrice dense riche en protéines","Rôle crucial pour la séparation finale (= abscission) entre les deux cellules filles : contrôle de la répartition correcte du cytoplasme et des organites","Site d’assemblage pour de nombreuses protéines qui régulent l’abscission : CEP55 se fixe au mid-body et recrute la machinerie ESCRT-III (filaments en spirale qui resserrent la membrane jusqu’à la couper) ; la spastine coupe les microtubules qui traversent le pont intercellulaire","Chez l’humain, en cas de chromatine persistante au niveau du pont, la kinase Aurora B retarde la coupure pour éviter d’endommager l’ADN (point de contrôle)"]],["Visualisation (p.22)",["Anticorps anti-actine et anti-myosine : anneau contractile au niveau du plan équatorial, au niveau des microtubules chevauchants"]]]},
{"id":"cyc8","t":"cycle","a":3,"r":CC,"q":"Quiescence et phase G0 : définition, rôles, exemples ?","p":"p.20","s":[["Quiescence",["État dans lequel une cellule n’est pas engagée dans la division cellulaire : cellule fonctionnelle mais qui ne se divise pas activement"]],["Phase G0",["Extension de la phase G1 ✪, sans progression vers la phase S (donc vers la réplication de l’ADN)","Rôle essentiel dans la régulation des tissus, la réparation et la protection contre le vieillissement et les dommages"]],["Rôles",["Protection et maintenance de l’intégrité de l’ADN et des fonctions des cellules","Réponse aux signaux leur permettant de réintégrer le cycle cellulaire","Résistance à la chimiothérapie : les traitements anticancéreux ciblent majoritairement les cellules en division"]],["Exemples",["Cellules différenciées : neurones, cellules musculaires, en phase G0 de manière permanente, ne se divisent plus après leur différenciation","Cellules souches adultes (ex : système hématopoïétique) : peuvent entrer en quiescence mais peuvent réintégrer le cycle en réponse à un signal spécifique (réparation tissulaire)"]]]},
{"id":"cyc9","t":"cycle","a":2,"r":CC,"q":"Méthodes d’étude du cycle : cytométrie en flux, marquage de l’ADN, synchronisation, modèles ?","p":"p.21-23","s":[["Cytométrie en flux (p.21)",["Agents intercalants de l’ADN : iodure de propidium, bromure d’éthidium ; mesure de la quantité de fluorescence par cellule (flux de cellules en suspension devant un laser) : fluorescence proportionnelle à la quantité d’ADN","G1 : quantité normale d’ADN (2N) ; S : entre 2N et 4N ; G2/M : quantité double d’ADN (4N)","Intérêt : effet de traitements, mécanismes de régulation, anomalies du cycle"]],["Marquage de l’ADN en synthèse (p.21)",["Cellules en phase S : incorporation de thymidine tritiée ou de bromodéoxyuridine (BrdU)","Révélation : autoradiographie ou technique immuno-enzymatique (anticorps anti-BrdU couplé à la peroxydase)"]],["Immunofluorescence (p.22)",["Marquage de l’ADN au DAPI ; microtubules marqués à l’aide d’anticorps couplés à un fluorochrome"]],["Synchronisation (p.23)",["Nocodazole : perturbation de la formation des microtubules et blocage en métaphase (reprise de la mitose à l’arrêt du traitement)","Hydroxyurée : inhibition de la synthèse d’ADN, blocage en phase S (réduit les pools de désoxyribonucléotides)","Aphidicoline : inhibiteur spécifique de l’ADN polymérase alpha, blocage en phase G1/S","Sérum starving (privation de sérum) : blocage en phase G0","Mécaniquement : ex. température (chez certains mutants de levures)"]],["Modèles les plus utilisés (p.23)",["Levures Saccharomyces cerevisiae et Schizosaccharomyces pombe : identification des protéines fondamentales","Œufs de Xenopus laevis : embryogenèse précoce et particulière pour l’étude biochimique","Drosophila melanogaster : étude des mécanismes du cycle chez les organismes pluricellulaires (modèles de cultures cellulaires)"]]]},
{"id":"cyc10","t":"cycle","a":2,"r":CC,"q":"Exceptions : cycles sans G1/G2, endoréplication, endoduplication ?","p":"p.25","s":[["Embryons d’amphibiens : absence de phases de transition",["Absence de phases G1 et G2 ✪ entre les cycles mitotiques pendant le développement embryonnaire précoce : cycle biphasique S/M, dès le premier stade et pendant 12 cycles","Permet une multiplication cellulaire beaucoup plus rapide"]],["Glandes salivaires de larves de drosophile : absence de phase M",["Cellules dupliquant leur ADN sans division cellulaire complète = endoréplication : augmentation de la ploïdie, chromosomes polytènes = chromosomes géants","Présence uniquement des phases G et S, absence de phase M ; après S, la cellule retourne à une nouvelle phase G ; absence de séparation des chromatides"]],["Embryons de drosophile : absence de division cellulaire",["Mitose sans cytodiérèse = endoduplication ✪ (= endomitose) : division des noyaux mais pas des cytoplasmes, aboutissant à un syncytium","Autres exemples : mégacaryocytes et ostéoclastes (cellules multinucléées du tissu osseux)"]]]},
{"id":"cyc11","t":"cycle","a":2,"r":CC,"q":"Expériences historiques : le MPF et les fusions de cellules ?","p":"p.26","s":[["Micro-injection de cytoplasme d’ovocyte (amphibien)",["Un ovocyte I (bloqué en prophase I) exposé à un stimulus hormonal (progestérone) reprend sa méiose : achève la première division et commence la méiose II jusqu’à la métaphase II (arrêt en métaphase II)","L’injection de cytoplasme d’un ovocyte bloqué en métaphase II dans un ovocyte immature en prophase I provoque la maturation de l’ovocyte","Conclusion : une substance dans le cytoplasme de l’ovocyte en métaphase II déclenche la maturation, appelée MPF (Maturation Promoting Factor)"]],["Fusions de cellules (obtention d’un hétérocaryon)",["Cellule G1 + cellule S : duplication de l’ADN de la cellule en G1 ; cellule G2 + cellule S : pas de duplication de l’ADN de la cellule en G2","Conclusion : un facteur cytoplasmique présent en phase S permet l’entrée en phase S des cellules n’ayant pas encore répliqué leur ADN (G1) ; sans effet sur les cellules ayant déjà réalisé la phase S (G2)","Cellule en mitose + cellule en interphase : condensation des chromosomes de la cellule en interphase ; il existe dans la cellule en mitose un facteur qui induit l’entrée en mitose : le MPF (M-phase Promoting Factor = Maturation Promoting Factor)","Ces expériences ont mis en évidence des complexes moléculaires qui contrôlent les transitions de phase : complexes d’une cycline et d’une kinase ✪ CDK"]]],"n":"Barré non repris : « suggère l’existence, en G2, d’un facteur qui empêche la re-réplication de l’ADN » et « = Mitosis Promoting Factor »."},
{"id":"cyc12","t":"cycle","a":4,"r":CC,"q":"CDK et cyclines : caractéristiques, associations selon la phase, régulation par phosphorylation ?","p":"p.27-29","s":[["Les CDK (p.27)",["Kinases dépendantes des cyclines : sérine/thréonine kinases (kinase = enzyme catalysant le transfert d’un groupement phosphate de l’ATP sur son substrat)","Très conservées entre les espèces ; tailles similaires autour de 30 à 40 kDa ; inactives à l’état monomérique","En quantité constante dans la cellule au cours du cycle (présentes tout au long du cycle)"]],["Les cyclines (p.27)",["Présence variable des cyclines selon le moment du cycle ✪ ; pas d’activité enzymatique : ce sont des protéines régulatrices","CDK fonctionnelles seulement si elles sont associées à des cyclines : elles phosphorylent des protéines cibles impliquées dans les événements du cycle (fragmentation de l’enveloppe nucléaire, condensation des chromosomes, réplication de l’ADN)"]],["Associations (p.28)",["Cycline D + CDK4/6 en phase G1 : progression de G1 à S","Cycline E + CDK2 en fin de G1 : entrée en phase S","Cycline A + CDK2 pendant la phase S : réplication de l’ADN (cycline A + CDK1 en G2)","Cycline B + CDK1 : entrée en mitose (transition G2/M)","Apparition ou disparition des cyclines à certains moments du cycle : activation ou inactivation des CDK ; une même cycline peut activer des CDK différentes, une même CDK peut s’associer à des cyclines différentes ; l’ordre d’intervention est déterminé en partie par l’ordre de transcription des cyclines"]],["Phosphorylations (p.29)",["Phosphorylation activatrice : par la kinase activatrice CAK (CDK-activating kinase) ; essentielle pour que le complexe cycline-CDK atteigne son activité maximale (stabilisation de la conformation active) ; exemple : résidu thréonine Thr161 pour CDK1","Phosphorylation inhibitrice : par des kinases inhibitrices comme Wee1 ✪ ; blocage de l’activité de la CDK ; exemple : résidus Thr14 et Tyr15 pour CDK1","Déphosphorylation pour levée de l’inhibition : par des phosphatases comme Cdc25 ✪ (retrait des phosphorylations inhibitrices de Wee1)","CDK1 est activée si : liaison à une cycline, phosphorylation en Thr161 par CAK et absence de phosphorylation en Thr14 et Tyr15"]]],"n":"Barré non repris : « ce qui entraîne un changement de conformation des protéines cibles leur conférant des activités nouvelles » (p.27)."},
{"id":"cyc13","t":"cycle","a":4,"r":CC,"q":"Inhibiteurs des CDK (CKI) : familles INK4 et CIP/KIP, p16, p21, p27 ?","p":"p.30, 34","s":[["Famille INK4 (p16, p15, p18, p19)",["Se lient spécifiquement aux CDK4 et CDK6, empêchant leur association avec les cyclines D : blocage de la progression de G1 à S (contrôle du point de restriction G1/S) ; cellule bloquée en G1","p16 est la protéine la plus étudiée : se lie à CDK4 et CDK6 et inhibe leur activité ✪, ce qui empêche la phosphorylation de la protéine Rb : maintien de Rb sous forme active ✪","Rb se lie aux facteurs de transcription E2F et empêche l’activation de gènes nécessaires à l’entrée en phase S : blocage de l’entrée en phase S"]],["Famille CIP/KIP (p21, p27, p57)",["Peuvent inhiber plusieurs complexes CDK-cycline (CDK2-cycline E, CDK1-cycline B) : régulation de la transition G1/S et de l’entrée en mitose","Liaison aux complexes CDK-Cycline et blocage de leur activité kinase ✪✪ en interférant avec le site de liaison de l’ATP","p21 inhibe CDK2-cycline E, CDK2-cycline A et CDK1-cycline B ; activé par le gène suppresseur de tumeur p53 en réponse à des dommages de l’ADN : blocage du cycle pour réparer l’ADN"]],["En pratique (p.34)",["p16 inhibe CDK4 et 6, ce qui empêche la phosphorylation de Rb : Rb reste lié à E2F, blocage du cycle en G1","p21/p27 inhibent le complexe cycline E/CDK2 : retardent l’entrée en phase S ; expression souvent activée en réponse à des dommages de l’ADN"]]]},
{"id":"cyc14","t":"cycle","a":3,"r":CC,"q":"Dégradation des cyclines : système ubiquitine-protéasome, SCF et APC/C ?","p":"p.31-33","s":[["Principe (p.31)",["Deux principaux complexes ubiquitine-ligases : complexe SCF (Skp, Cullin, F-box containing complex) et complexe APC/C (Anaphase Promoting Complex/Cyclosome)","Polyubiquitination : la protéine cible est marquée par l’ajout de chaînes d’ubiquitine via une enzyme appelée ligase E3 (signale que la protéine doit être dégradée)","Dégradation par le protéasome 26S, complexe protéique responsable de la dégradation des protéines marquées"]],["Complexe SCF (p.32)",["Se lie à une protéine possédant une F box, ce qui permet son activation","Le complexe activé polyubiquitine les CKI ✪ préalablement phosphorylés par une kinase : dégradation par le protéasome ; important lors de la transition G1/S","Exemple de p27 : le CKI p27 empêche l’activation de CDK2-cycline E ; SCF reconnaît p27 phosphorylé via sa sous-unité Skp2 ; polyubiquitination puis dégradation de p27 : activation du complexe CDK2-cycline E, entrée en phase S"]],["Complexe APC/C (p.33)",["Ubiquitine ligase (E3) avec 2 cibles principales : la sécurine et la cycline B (inactivation de Cdk1 et sortie de la mitose)","En métaphase, Cdc20 se lie au complexe APC/C et permet son activation","Le complexe activé recrute les enzymes E1 et E2 pour catalyser l’ubiquitination de protéines cibles telles que la cycline B ✪ ; dégradation des protéines ciblées par le protéasome ✪","Cdh1 remplace ensuite Cdc20 pour permettre au complexe APC/C de rester actif durant la phase G1"]]]},
{"id":"cyc15","t":"cycle","a":4,"r":CC,"q":"Points de contrôle du cycle : G1/S, G2/M, fuseau mitotique ; dysfonctionnement ?","p":"p.24, 34","s":[["Rôle (p.24)",["Garantissent que les cellules progressent correctement à travers les phases du cycle ; rôle de prévenir la prolifération incontrôlée des cellules"]],["Point de contrôle G1/S (point de restriction)",["En fin de phase G1 : détermine si la cellule est prête à rentrer en phase S ; vérifie la bonne intégrité de l’ADN ✪ et la présence de suffisamment de nutriments ✪","La protéine p53 arrête le cycle cellulaire en cas de dommages à l’ADN"]],["Point de contrôle G2/M",["À la transition entre G2 et la mitose : vérifie si l’ADN a été répliqué correctement ✪ ; protéine impliquée : MPF"]],["Point de contrôle du fuseau mitotique (SAC)",["Pendant la métaphase : vérifie que tous les chromosomes sont attachés aux microtubules du fuseau et alignés sur la plaque métaphasique ✪","Protéine impliquée : complexe APC, inhibé jusqu’à ce que tous les kinétochores soient correctement attachés aux microtubules"]],["Dysfonctionnement",["Mutations et anomalies chromosomiques favorisant le développement de cancers : mutations dans les gènes p53 ou Rb ✪✪ (rétinoblastome) peuvent entraîner un dysfonctionnement des points de contrôle G1/S, favorisant une prolifération cellulaire anarchique","Beaucoup de cellules somatiques deviennent tumorales à cause de mutations dans des gènes (sur les 2 allèles) qui contrôlent le cycle ; p53 est muté dans plus de 70 % des tumeurs chez l’Homme","Les cellules tumorales se divisent en permanence sans contrôle : formation d’une masse tumorale avec des cellules qui accumulent des mutations"]],["Contrôle de la transition G1/S ✪ : la protéine Rb (p.34)",["Régulateur négatif de la progression du cycle : sous forme non phosphorylée ✪, Rb se lie au facteur de transcription E2F ✪ et inhibe son activité ✪✪ en empêchant la transcription de gènes nécessaires à la transition G1/S","Les complexes cycline D/CDK4 et 6 et cycline E/CDK2 phosphorylent progressivement Rb ✪✪ : libération de E2F, transcription de gènes codant pour des protéines indispensables à la réplication de l’ADN ✪, entrée en phase S"]]]},
{"id":"cyc16","t":"cycle","a":3,"r":CC,"q":"Contrôle de la réplication en phase S : ORC, Cdc6, Cdt1, MCM ?","p":"p.35","s":[["En phase G1 : l’autorisation",["Le complexe ORC (Origin Recognition Complex) se fixe sur les origines de réplication","ORC, Cdc6 et Cdt1 chargent l’hélicase MCM sur les origines de réplication","L’ensemble forme un complexe pré-réplicatif (PRC) qui est encore inactif"]],["En phase S : l’activation et le verrou",["La S-Cdk (cycline A/CDK2) et la kinase DDK activent l’hélicase MCM ✪ : ouverture de l’ADN, recrutement des polymérases","La S-Cdk inactive ORC, Cdc6 et Cdt1 ✪ par phosphorylation : aucun nouveau complexe pré-réplicatif avant la prochaine phase G1 ; une seule réplication par cycle"]]]},
{"id":"cyc17","t":"cycle","a":4,"r":CC,"q":"Transition G2/M : MPF (cycline B/CDK1), Wee1, Cdc25, protéines phosphorylées ?","p":"p.36","s":[["MPF = complexe cycline B / CDK1",["La cycline B s’accumule en G2 et s’associe à CDK1","En phase G2, le complexe est maintenu inactif par les phosphorylations inhibitrices de Wee1 ✪, malgré la phosphorylation activatrice de CAK","Pour permettre l’entrée en mitose, la phosphatase Cdc25 déphosphoryle CDK1, ce qui permet au MPF de devenir actif","Surveillance de la transition G2/M : en cas d’ADN endommagé ou non répliqué, la kinase ATR active les protéines Chk1/Chk2 qui inhibent Cdc25 : arrêt de la cellule en phase G2"]],["Protéines phosphorylées par cycline B/CDK1",["Condensines et histone H1 : condensation des chromosomes","Lamines nucléaires : rupture de l’enveloppe nucléaire","Protéines des centrosomes et des microtubules : assemblage du fuseau mitotique","Protéines des kinétochores : attachement des chromosomes au fuseau mitotique","Cdc25 et Wee1 : le MPF active Cdc25 et inhibe Wee1, ce qui permet une auto-amplification du MPF et une entrée en mitose irréversible (rétroaction positive)","Complexe APC/C : préparation de la propre fin du MPF (future dégradation de la cycline B)"]]]},
{"id":"cyc18","t":"cycle","a":3,"r":CC,"q":"Transition métaphase-anaphase : APC/C, sécurine, séparase, contrôle du fuseau ?","p":"p.37","s":[["Par APC/C",["Activé par Cdc20, APC/C permet l’ubiquitination de la sécurine et de la cycline B par les enzymes E1 et E2, ce qui entraîne leur dégradation par le protéasome"]],["Séparation des chromatides sœurs",["La séparase est initialement inhibée par la sécurine ✪","L’activation d’APC/C permet la polyubiquitinylation de la sécurine et sa destruction par les enzymes du protéasome : levée d’inhibition de la séparase qui devient active ✪","La séparase clive les cohésines ✪ qui maintenaient la cohésion des chromatides sœurs : les deux chromatides peuvent alors se séparer lors de l’anaphase"]],["Contrôle du fuseau",["Émission d’un signal en cas de mauvais attachement d’un kinétochore : activation des protéines Mad2 et BubR1 qui se fixent sur Cdc20 et empêchent ainsi l’activation d’APC/C","Absence de dégradation de la sécurine : inhibition de l’entrée en anaphase"]]]},
{"id":"cyc19","t":"cycle","a":1,"r":CC,"q":"Mitogènes et facteurs de croissance : voie Ras/MAPK, myc, PI3K/TOR ?","p":"p.38","s":[["Mitogènes et prolifération",["Signaux extracellulaires qui autorisent la cellule à progresser en G1 et à s’engager vers la phase S ; se fixent sur un récepteur membranaire, le plus souvent un récepteur à activité tyrosine kinase (RTK)","Activation de la petite protéine G Ras, puis cascade des MAP kinases : Raf phosphoryle MEK qui phosphoryle ERK ; ERK activée pénètre dans le noyau","Transcription en deux vagues : ERK induit des gènes précoces immédiats dont myc ; Myc (facteur de transcription) induit des gènes de réponse retardée dont la cycline D","Levée du frein : cycline D/CDK4 et 6 phosphoryle Rb, libération de E2F, transcription de gènes de phase S (cyclines E et A, réplication)","Rétroactions positives : auto-activation de E2F via cycline E/CDK2 ; point de restriction = engagement irréversible, indépendant du mitogène"]],["Facteurs de croissance et croissance cellulaire",["Se fixent sur des récepteurs à activité tyrosine kinase : dimérisation et autophosphorylation ; recrutement de la PI3-kinase : chaîne PI3K → PIP3 → Akt → TOR","TOR intègre deux signaux nécessaires : facteurs de croissance et présence d’acides aminés en quantité suffisante","Effets de TOR : activation de facteurs de transcription (production de ribosomes), activation de la kinase S6K (phosphoryle des protéines ribosomiques), inhibition de 4E-BP (libération d’eIF4E : stimule la synthèse protéique), inhibition de l’autophagie","Croissance ≠ division : les facteurs de croissance augmentent la masse cellulaire alors que les mitogènes déclenchent la division"]]]},
{"id":"cyc20","t":"cycle","a":4,"r":CC,"q":"Blocage du cycle après un dommage de l’ADN : voie ATM/ATR – p53 – p21 ?","p":"p.39","s":[["Activation de la voie p53",["Rayons X : dommages de l’ADN, souvent des cassures double brin ; système de réparation reposant sur les kinases ATM/ATR qui détectent les dommages et déclenchent une cascade de signalisation : activation des kinases Chk1/Chk2 qui ciblent p53","p53 = « gardienne du génome » (préservation de l’intégrité de l’ADN)","Condition normale : p53 inactive, liée à Mdm2 qui favorise sa dégradation en l’envoyant au protéasome","Dommages génétiques : p53 est phosphorylée et échappe à Mdm2 ; stabilisation : p53 s’accumule et devient active","p53 se lie aux sites de régulation du gène codant la CKI p21 et active sa transcription","p21 inhibe des complexes cycline/CDK ✪ : G1/S-Cdk et S-Cdk inactives, arrêt en G1","Issue : réparation de l’ADN ou apoptose si les dommages sont irréparables"]]]},
{"id":"cyc21","t":"cycle","a":3,"r":CC,"q":"Cycle cellulaire et cancers : perte de p16, rôle de p53 (Myc, ARF, Mdm2) ?","p":"p.40-41","s":[["Défauts du point de restriction (p16)",["Cellule qui ne prolifère pas : p16 (inhibiteur de CDK4 et 6) empêche l’activation du complexe cycline D/CDK4 et 6 ; Rb reste active et séquestre E2F ; arrêt en G1","Perte de p16 (mutation, délétion du gène, extinction par méthylation) : cycline D/CDK4 activée, Rb phosphorylée donc inactive, E2F libéré : franchissement du point de restriction G1/S","Absence de p16 fréquente dans de nombreux cancers (mélanome, cancer du pancréas, cancer du poumon) ; altération de toute la voie p16 / cycline D-CDK4 et 6 / Rb dans la plupart des cancers","Cibles thérapeutiques : inhibiteurs spécifiques de CDK4 et 6 pour le traitement de certains cancers"]],["Rôle de p53 en réponse à un signal mitogénique inapproprié",["Production excessive de la protéine Myc (oncogène activé) : induction de ARF qui inhibe Mdm2 ; p53 est stabilisée et active","Voie distincte de la réponse aux dommages de l’ADN (pas de passage par ATM/ATR), qui converge sur p53","Deux issues : arrêt du cycle cellulaire via p21 (et souvent sénescence) ou apoptose via Bax, Puma et Noxa","Barrière anti-cancéreuse : les tumeurs à Myc perdent souvent cette voie (p53 mutée, ARF délétée, Mdm2 amplifiée)"]],["Conclusion (p.41)",["Points clés de la régulation : complexes cyclines/CDK, points de contrôle (intégrité de l’ADN, préparation à la division), complexes APC/C et SCF (dégradation de protéines clés par le protéasome), phosphorylations et déphosphorylations","Importance : maintien de l’intégrité génomique, dérèglement dans les cancers, régulateurs du cycle = cibles thérapeutiques pour bloquer la division des cellules tumorales"]]]},
{"id":"mit1","t":"mito","a":3,"r":MI,"q":"Mitochondries : caractéristiques générales, forme, nombre, localisation ?","p":"p.5-7","s":[["Organites cytoplasmiques à double membrane (p.5)",["Présentes uniquement chez les eucaryotes, dans tous les types cellulaires ; indispensables au fonctionnement de la cellule","Possèdent leur propre génome ; des éléments provenant de l’ADN nucléaire sont toutefois nécessaires à leur fonctionnement","Plusieurs fonctions, dont la production énergétique ; se déplacent au sein de la cellule grâce au cytosquelette"]],["Nombre variable par cellule (p.5)",["1 000 à 3 000 mitochondries en moyenne, selon les types cellulaires ; en réalité de 100 à 1 million selon les cellules","Nombre lié aux besoins énergétiques de la cellule (une cellule musculaire a besoin de beaucoup d’ATP, donc de beaucoup de mitochondries) ; varie aussi selon les conditions dans un même type cellulaire (pratique sportive prolongée : forte augmentation)","Demi-vie (temps nécessaire pour perdre la moitié de la quantité initiale) : 6 à 10 jours en moyenne, parfois supérieure selon les conditions ; notion très utilisée en pharmacologie"]],["Aspect morphologique (p.6)",["Forme plutôt allongée en condition physiologique ; globulaire en condition de stress (ex : diminution de la quantité d’oxygène, drogue toxique pour la cellule)","Dimensions (schéma) ✪ : longueur d’environ 1 à 2 µm, largeur d’environ 0,1 à 0,5 µm","Membrane externe ; membrane interne formant des crêtes mitochondriales (multiplient la surface d’insertion des complexes servant à former l’ATP) ; espace intermembranaire (stockage des protons nécessaires à la formation d’ATP par l’ATP synthase) ; matrice (lieu où se retrouve l’ATP formé ; ATP exporté hors de la mitochondrie, la mitochondrie en consomme elle-même une partie)"]],["En microscopie à fluorescence (p.7)",["Réseau dynamique visible dans tout le cytoplasme : connexions fréquentes entre les mitochondries, orientation par le cytosquelette","Les mitochondries s’adaptent aux besoins énergétiques et aux contraintes mécaniques : proches du noyau, elles sont petites et d’aspect plus arrondi ; en périphérie de la cellule, elles sont plus fines et longues"]],["Localisation (p.7)",["Jamais dans le noyau, ni dans les autres organites ; seule exception : adressage de mitochondries au lysosome pour être dégradées","Nombreuses dans les tissus à haute consommation énergétique : cellules musculaires squelettiques ou cardiaques ; spermatozoïde (peu de mitochondries dans la tête, nombreuses dans le flagelle pour sa propulsion)"]]],"n":"La valeur des dimensions est lue sur le schéma p.6 (texte tourné) : à vérifier sur ton poly."},
{"id":"mit2","t":"mito","a":3,"r":MI,"q":"Membrane externe et espace intermembranaire : composition, porines, perméabilité ?","p":"p.8","s":[["Membrane externe ✪ : bicouche lipidique",["Épaisseur de 5 à 7 nm, proche de celle d’une membrane plasmique ; composition proche de celle de la membrane plasmique","Contient 50 à 60 % de protéines et 50 à 40 % de lipides (dans une membrane plasmique classique, les protéines représentent 30 à 50 %)"]],["Riche en porines",["Protéines formant des canaux : pores volumineux d’un diamètre de 2 à 3 nm, différents des canaux ioniques ; une porine ne possède pas de filtre électrostatique de sélectivité et laisse passer de nombreuses molécules","Passage passif, dans le sens du gradient, de petites molécules et d’ions : ATP et ADP, phosphate inorganique, certains métabolites (pyruvate issu de la glycolyse), acides gras, ions et petites molécules hydrophiles","Membrane externe perméable aux ions et molécules de masse moléculaire inférieure à 10 kDa ✪ (en réalité plutôt autour de 5 kDa)"]],["Espace intermembranaire",["Épaisseur de 4 à 7 nm, proche de celle de la membrane externe (espace limité) ; peut héberger des molécules de taille inférieure à 10 kDa","Contient des protons H⁺ ✪ : rôle dans la phosphorylation oxydative (protons permettant le fonctionnement de l’ATP synthase)","Contient des molécules dont le cytochrome C : rôle important dans l’apoptose"]]]},
{"id":"mit3","t":"mito","a":3,"r":MI,"q":"Membrane interne : composition, crêtes, cardiolipine, transports ?","p":"p.9, 4","s":[["Bicouche lipidique",["Épaisseur de 5 à 6 nm ; organisation très différente de celle de la membrane externe ✪✪","Contient 80 % de protéines et 20 % de lipides : nombreux complexes formant l’ATP (en lien avec le nombre de crêtes mitochondriales) ; riche en transporteurs et complexes protéiques enzymatiques","Absence de porines dans la membrane interne ; faible fluidité (très forte proportion de protéines : très peu de mouvement dans la membrane)"]],["Riche en cardiolipine ✪✪",["Doit se trouver dans la membrane interne en conditions physiologiques ; perte de cette localisation si les conditions physiologiques ne sont plus réunies (processus d’apoptose)","Absence de cholestérol ; la cardiolipine est un phospholipide à quatre chaînes hydrophobes (4 chaînes d’acides gras, 2 groupements phosphates, squelette de glycérol), également retrouvé chez certaines bactéries (marquage chez E. coli)"]],["Crêtes mitochondriales ✪✪",["Replis complexes de la membrane interne ; projetées dans la matrice ✪✪"]],["Passage souvent actif à travers la membrane interne",["Consommation d’énergie : transports actifs secondaires","Antiport ATP/ADP ; symports métabolites/H⁺ : passage des protons dans le sens de leur gradient, passage du phosphate, des acides gras et du pyruvate de l’espace intermembranaire vers la matrice (pyruvate ensuite transformé dans le cycle de Krebs)"]]]},
{"id":"mit4","t":"mito","a":3,"r":MI,"q":"Matrice mitochondriale : aspect et contenu ?","p":"p.10","s":[["Finement granuleuse",["En raison des nombreuses structures de petite taille : nombreuses enzymes, densification de la matrice (aspect plus foncé en microscopie électronique à transmission)"]],["Contenu",["Mitoribosomes ✪ ressemblant aux ribosomes bactériens","ADN ✪✪ circulaire (ADNmt)","ARN messagers et ARN de transfert","Nombreux systèmes enzymatiques : enzymes établissant une oxydation du pyruvate, enzymes oxydant des acides gras, enzymes appartenant au cycle citrique = cycle de Krebs"]]]},
{"id":"mit5","t":"mito","a":2,"r":MI,"q":"Importation des protéines (et des lipides) dans la mitochondrie ?","p":"p.16-17","s":[["Importation des protéines (p.16)",["L’ADN mitochondrial ne permet pas de produire l’ensemble des protéines nécessaires ; la majorité des protéines mitochondriales proviennent du cytoplasme (environ 500 protéines minimum, codées par l’ADN nucléaire)","Mécanisme post-traductionnel : importation après la synthèse de la protéine","Adressage précis : séquence d’adressage (varie selon le type de protéine) et pore de translocation","Protéines chaperonnes : système variable selon la localisation finale ; ex : mtHSP70 au niveau de la membrane interne : consomme de l’ATP pour faire entrer la protéine dans la matrice ; liée à l’ADP, l’affinité est plus faible, ce qui permet la libération de la protéine dans la matrice ; fonctionnement différent au niveau de la membrane externe (nombreuses porines)"]],["Complexes d’importation (p.17)",["Membrane externe : TOM = porte d’entrée principale (passage obligé avant les autres complexes) ; SAM = assemblage des protéines à feuillet bêta (ex : porines insérées dans la membrane externe)","Membrane interne : TIM23 = import vers la matrice ou insertion dans la membrane interne (passage obligatoire pour rejoindre la matrice) ; TIM22 = insertion des protéines à plusieurs passages transmembranaires ; OXA1 = insertion de protéines dans la membrane interne depuis la matrice","Espace intermembranaire : MIA = import et maturation de protéines adressées à l’espace intermembranaire (protéines riches en cystéines)"]],["Importation des lipides (p.17)",["Mécanismes mal connus, dépendants du lipide ; lipides provenant le plus souvent du réticulum endoplasmique lisse","Navette ou échange direct entre RE et mitochondrie : zones de contact MAM (Mitochondria-Associated Membranes) ; pas de transport vésiculaire"]]]},
{"id":"mit6","t":"mito","a":3,"r":MI,"q":"ADN mitochondrial : taille, gènes, quantité ?","p":"p.24","s":[["Molécule circulaire",["16 569 paires de bases (pb) ✪","Pas de partie non codante (pas d’introns) ; exception : la boucle D, région régulatrice de la réplication et de la transcription"]],["Gènes",["37 gènes codant pour : 13 sous-unités de la chaîne respiratoire (complexe I : 7, complexe III : 1, complexe IV : 3, ATP synthétase : 2 ; insuffisantes pour former toute la chaîne respiratoire), 22 ARN de transfert et 2 ARN ribosomaux"]],["Quantité",["2 à 10 copies d’ADNmt par mitochondrie (dépend du type cellulaire) ; 10² à 10⁶ mitochondries par cellule, soit plus de 1 000 copies d’ADNmt par cellule","Représente 1 % de l’ADN cellulaire total ✪"]]]},
{"id":"mit7","t":"mito","a":1,"r":MI,"q":"Mutations de l’ADNmt : hérédité, hétéroplasmie, double origine des protéines ?","p":"p.24-26","s":[["Mutations et transmission (p.24)",["L’ADNmt mute 10 à 20 fois plus que l’ADN nucléaire : exposition plus importante aux EROs (fuite d’électrons et association avec l’O₂), systèmes de protection limités","Mécanismes de réparation moins diversifiés que pour l’ADN nucléaire (réparation plus longue ou plus complexe)","ADNmt d’origine maternelle : transmission maternelle des mutations ponctuelles ; délétions très rares (cas sporadiques)"]],["Hétéroplasmie (p.25)",["Coexistence de molécules normales et mutées dans une même cellule ; proportion variable entre mitochondries, cellules, tissus","Effet seuil : modification du phénotype au-delà d’une valeur critique d’ADNmt muté (seuil variable selon les tissus ou les cellules)","Fécondation : répartition inégale des mitochondries mutées dans les ovocytes ; mère asymptomatique et enfants atteints à des degrés variables (sous le seuil : pas d’effet ; au niveau du seuil : premiers effets ; au-dessus : maladie complète)"]],["Double origine des protéines (p.26)",["Génome mitochondrial : 20 % des protéines nécessaires aux fonctions mitochondriales, produites in situ dans la mitochondrie","Génome nucléaire : 80 %, synthétisées dans le cytosol et importées dans la mitochondrie","Sous-unités codées par l’ADNmt / l’ADN nucléaire : complexe I : 7 / plus de 30 ; complexe II : 0 / 4 ; complexe III : 1 / 10 ; complexe IV : 3 / 10 ; complexe V (ATPase) : 2 / 9"]]]},
{"id":"mit8","t":"mito","a":2,"r":MI,"q":"Chaîne respiratoire : complexes, trajet des électrons, gradient de protons, inhibiteurs ?","p":"p.18","s":[["Chaîne respiratoire mitochondriale",["Phosphorylation oxydative au niveau de la chaîne respiratoire : ensemble de 5 complexes protéiques dans la membrane interne ; complexes I, III, IV et V transmembranaires ; complexe II lié à la membrane (non transmembranaire)"]],["Trajet des électrons",["Électrons capturés à partir de molécules donneuses (NADH,H⁺ et FADH₂) ; circulation à travers les complexes (réactions d’oxydo-réduction) : génèrent de l’énergie = force électromotrice","Électrons du NADH,H⁺ : complexes I, III, IV puis V ; électrons du FADH₂ : complexes II, III, IV puis V"]],["Gradient de protons ✪",["Activation des pompes à H⁺ par l’énergie générée : protons pompés de la matrice vers l’espace intermembranaire","Gradient de H⁺ (force proton-motrice) utilisé pour produire de l’ATP ; retour des protons vers la matrice principalement par l’ATP synthase (complexe V), également par les symports"]],["Accepteur final",["Oxygène = accepteur final des électrons : consommation d’O₂ et production d’H₂O (2 H⁺ + ½ O₂ → H₂O, soit 4 H⁺ + O₂ → 2 H₂O)"]],["Inhibiteurs",["Roténone = inhibiteur du complexe I ; antimycine = inhibiteur du complexe III ; cyanure = inhibiteur du complexe IV ; oligomycine ✪ = inhibiteur du complexe V (ATP synthase)"]]]},
{"id":"mit9","t":"mito","a":0,"r":MI,"q":"ATP synthase (complexe V) : structure et fonctionnement ?","p":"p.19","s":[["Structure du complexe V",["F₀ = « tube » transmembranaire ; F₁ = « turbine » du côté de la matrice : axe central (sous-unité γ) et trois sous-unités β catalytiques"]],["Fonctionnement",["Retour des protons dans la matrice en empruntant la partie F₀ : rotation partielle de F₀","Rotation transmise à l’axe central (sous-unité γ) au sein du domaine F₁ : changements de conformation des trois sous-unités β","Les trois sous-unités β passent successivement par trois conformations : L (Loose) fixe l’ADP et le phosphate inorganique (Pi) ; T (Tight) favorise la formation et maintient l’ATP ; O (Open) libère l’ATP"]],["Rendement et conditions",["Un tour complet de l’axe γ permet de produire 3 molécules d’ATP ; ratio H⁺/ATP de 2,67 chez l’animal (soit 8 protons pour former 3 ATP)","Conditions d’activité : besoin en ATP, rapport ATP/ADP faible"]]]},
{"id":"mit10","t":"mito","a":1,"r":MI,"q":"Origine du NADH,H⁺ et du FADH₂ ; navettes malate-aspartate et glycérol-3-phosphate ?","p":"p.20-21","s":[["Origine des substrats (p.20)",["Glucides : glycolyse (glucose → pyruvate, dans le cytoplasme ; fournit de l’ATP et du NADH,H⁺ cytosolique qui nécessite un « transfert » dans la mitochondrie) ; le pyruvate entre dans la mitochondrie (pas le glucose)","Décarboxylation oxydative : pyruvate → acétyl-CoA, dans la mitochondrie (produit du NADH,H⁺) ; cycle de Krebs à partir de l’acétyl-CoA, dans la mitochondrie : 3 NADH,H⁺ et 1 FADH₂ par acétyl-CoA","Lipides : β-oxydation des acides gras (acyl-CoA → acétyl-CoA) dans la mitochondrie ✪ : produit du NADH,H⁺ et du FADH₂","Protéines : acides aminés convertis en intermédiaires du cycle de Krebs, dans la mitochondrie ; pas de cofacteurs formés avant le cycle de Krebs","Cofacteurs produits in situ : directement utilisables pour la phosphorylation oxydative"]],["Navettes (p.20-21)",["Le NADH,H⁺ de la glycolyse est formé dans le cytoplasme et ne traverse pas les membranes : énergie transférée à des navettes, restituée du côté matrice à un NAD⁺ ou à un FAD","Navette malate-aspartate : molécule transférée = malate ; accepteur matriciel = NAD⁺ ; production de NADH matriciel (transfert artificiel)","Navette glycérol-3-phosphate : molécule transférée = glycérol-3-phosphate ; accepteur matriciel = FAD ; pas de NADH matriciel : production de FADH₂"]]]},
{"id":"mit11","t":"mito","a":1,"r":MI,"q":"EROs et vieillissement cellulaire : formation et effets ?","p":"p.23","s":[["Espèces réactives de l’oxygène",["= EROs (ou ROS, Reactive Oxygen Species) ; les mitochondries sont à la fois source et cible des EROs","Production importante suite à un mauvais fonctionnement des mitochondries ; EROs toxiques pour la cellule, en particulier pour les mitochondries"]],["Formation des EROs",["Protons saturant l’espace intermembranaire, poussant sur les membranes (passage de protons à travers l’ATP synthase et les porines) ; modification des capacités de la chaîne respiratoire : moindre passage d’électrons, moins d’oxygène consommé","Électrons réagissant directement avec l’oxygène : formation d’EROs"]],["Effets des EROs",["Diminution de la fluidité membranaire ✪ (capacité de rétention des protons modifiée) ; diminution de l’activité de la chaîne respiratoire ; augmentation des mutations de l’ADNmt ✪","Réponse au stress : arrêt de la croissance cellulaire, apoptose","Avec l’âge : cercle vicieux (déclin progressif des fonctions respiratoires mitochondriales, à l’origine d’une augmentation de la production de radicaux libres (EROs) ✪ qui amplifierait le phénomène)"]]]},
{"id":"mit12","t":"mito","a":1,"r":MI,"q":"Mitochondrie et apoptose : cytochrome c ?","p":"p.22","s":[["Rôle dans l’apoptose",["Augmentation massive du calcium cytosolique ; gonflement des mitochondries","Libération des molécules apoptogènes mitochondriales : cytochrome c ✪ (rôle important dans une des formes d’apoptose)","Cytochrome c : non localisé dans la membrane (contenu dans l’espace intermembranaire)"]]]},
{"id":"mit13","t":"mito","a":0,"r":MI,"q":"Homéostasie calcique et fonctions de synthèse de la mitochondrie ?","p":"p.21-22","s":[["Homéostasie calcique (p.22)",["Principal réservoir : réticulum endoplasmique lisse ; le calcium peut aussi être stocké dans la mitochondrie (de façon moindre)","Régulation de la concentration intracellulaire de calcium : mécanismes peu connus, transports à travers des échangeurs (ex : échangeurs Na⁺/Ca²⁺)","Membrane interne : mtCU (Mitochondrial Calcium Uniporter) permet l’entrée du Ca²⁺ dans la matrice ; NCLX permet principalement la sortie du Ca²⁺ en échange de Na⁺ (de la matrice vers l’espace intermembranaire, sortie ensuite facilitée par les porines)","MAM : zones de contact entre RE et mitochondries, facilitent le transfert local du calcium (échanges directs entre RE et mitochondrie, à travers la membrane externe)"]],["Fonctions de synthèse (p.21)",["Hormones stéroïdiennes : participation, avec le RE, à la biosynthèse à partir du cholestérol grâce à des cytochromes P450 mitochondriaux ; exemple : cortisol (une étape a lieu dans la mitochondrie : transformation du cholestérol en prégnénolone)","Acides aminés non essentiels (précurseurs) : α-cétoglutarate → glutamate (→ glutamine, proline) ; oxaloacétate → aspartate ; le pyruvate est le précurseur de l’alanine (pyruvate issu de la glycolyse, pas de rôle de la mitochondrie dans sa formation)"]]]},
{"id":"mit14","t":"mito","a":0,"r":MI,"q":"Dynamique mitochondriale : biogenèse, fission, fusion, mitophagie (PINK1/Parkin) ?","p":"p.12-15","s":[["Dynamique (p.12)",["Mitochondries toujours capables de s’adapter à leur environnement","Biogenèse : augmentation de la masse mitochondriale par synthèse de composants mitochondriaux et réplication de l’ADNmt ; but : adapter la capacité de production d’ATP (souvent insuffisante pour répondre aux besoins)","Fission : division d’une mitochondrie en deux plus petites (processus rapide : environ 1 minute ; réseau fragmenté) ; protéines : Drp1, hFis1, GDAP1","Fusion : deux mitochondries n’en forment plus qu’une (réseau filamenteux) ; protéines : Opa1, Mitofusine 1, Mitofusine 2 ; équilibre dynamique entre fission et fusion selon les besoins énergétiques"]],["Fission (p.13)",["hFIS1 recrute la protéine DRP1 à la surface des mitochondries pour initier la scission","DRP1 (GTPase) : recrutée à la surface, se contracte autour de la membrane externe pour la scinder (énergie fournie par l’hydrolyse du GTP) ; après hydrolyse du GTP en GDP, affinité plus faible pour la membrane externe : libération puis recyclage (possible seulement une fois DRP1 à nouveau liée à un GTP)","GDAP1 : facilite la fragmentation du réseau mitochondrial et contribue à la régulation de la dynamique"]],["Fusion (p.14)",["Mitofusines 1 et 2 : situées sur la membrane externe (côté cytoplasmique), facilitent la fusion (reconnaissance et début d’interaction entre deux mitochondries)","OPA1 (GTPase) : présente sur la membrane interne, aide à la fusion de cette membrane, stabilise la structure mitochondriale interne, consomme du GTP ; NME4 : fournit du GTP à OPA1 (rôle plutôt régulateur)","Rôles de la fusion : optimiser la production d’énergie (mitochondries plus grandes ou structures ramifiées) ; participation à la restauration et à la réparation (mélange du contenu mitochondrial, possible si le problème est léger)"]],["Rôles de la fission (p.15)",["Répartition des mitochondries (plus petites : transportées plus facilement vers les zones où l’énergie est nécessaire) ; élimination des mitochondries endommagées par mitophagie ; adaptation de la taille et du nombre à ses besoins métaboliques ; répartition entre les deux cellules filles lors de la division cellulaire"]],["Voie PINK1/Parkin (p.15)",["1) La mitochondrie endommagée perd son potentiel de membrane ; 2) PINK1 s’accumule sur la membrane externe ; 3) PINK1 recrute et active Parkin, une ubiquitine-ligase (protéines mitochondriales ubiquitinées) ; 4) la mitochondrie est reconnue par la machinerie autophagique et dégradée","Dans la mitophagie : adressage indirect au lysosome (pas au protéasome)"]]]},
{"id":"mit15","t":"mito","a":0,"r":MI,"q":"Historique et théorie endosymbiotique : arguments ?","p":"p.3-4","s":[["Chronologie (p.3)",["1890 : Altman (granules semblables à des bactéries) ; 1932/1934 : Bensley isole les mitochondries à partir du foie de cobaye ; 1952-1953 : Palade et Sjostrand décrivent l’organisation générale ; 1963-1965 : Schatz et Nass mettent en évidence l’ADN mitochondrial ; 1996 : Liu décrit le rôle des mitochondries dans l’apoptose (libération du cytochrome C)"]],["Théorie endosymbiotique (p.3)",["Les mitochondries ont probablement évolué à partir de bactéries procaryotes aérobies internalisées par des cellules eucaryotes primitives : entrée en symbiose ; au cours de l’évolution, transfert de gènes vers le noyau"]],["Éléments en faveur (p.4)",["Double membrane, comme les bactéries Gram négatif ; ADN circulaire très différent de l’ADN nucléaire (2 à 10 molécules par mitochondrie chez l’Homme, homologie de séquence avec l’ADN de certaines bactéries)","Mitoribosomes proches des ribosomes bactériens : sensibilité à certains antibiotiques comme le chloramphénicol (empêche la formation des liaisons peptidiques : effet sur la traduction mitochondriale, pas sur celle des gènes nucléaires)","Chimiosmose comparable chez la bactérie et la mitochondrie (transport des électrons, pompage des protons, synthèse d’ATP)","Membrane interne : absence de cholestérol, présence de cardiolipine (aussi chez certaines bactéries)"]]]},
{"id":"mit16","t":"mito","a":0,"r":MI,"q":"Fractionnement des mitochondries : comment isoler les compartiments ?","p":"p.11","s":[["Isolement des compartiments",["1) Milieu hypotonique (faible osmolarité) : rupture de la membrane externe (choc osmotique : eau entrant et remplissant l’espace intermembranaire jusqu’à l’éclatement)","2) Centrifugation : le surnageant correspond à l’espace intermembranaire","3) Transfert du culot dans un tampon hypertonique et séparation selon un gradient de densité : contraction de la membrane interne et de la matrice ; séparation des fragments de membrane externe","4) Séparation de la membrane interne et de la matrice par choc osmotique (rupture puis centrifugation)"]],["Précautions",["Retrait rapide de l’eau, remplacée par un milieu iso-osmotique (ex : NaCl à 0,9 %) : évite l’éclatement prématuré de la membrane interne"]]]},
{"id":"mit17","t":"mito","a":0,"r":MI,"q":"Maladies mitochondriales : origine, cytopathies, syndromes, diagnostic ?","p":"p.26-28","s":[["Origine des maladies mitochondriales ✪ (p.26)",["Mutation de l’ADNmt (majorité des cas) : gène d’une sous-unité d’un complexe de la chaîne respiratoire, ou gène d’ARNt ou d’ARNr","Mutation d’un gène nucléaire : protéine dirigée vers les mitochondries (sous-unités d’un complexe, protéines d’assemblage, de la machinerie de réplication, de fission ou fusion, de maintenance de l’ADNmt)","Effets cellulaires : altération du fonctionnement mitochondrial, libération d’électrons, génération d’EROs (espérance de vie réduite) ; accumulation de fer mitochondrial","Origine constitutionnelle (génétique, transmise par la mère) ou acquise (ex : atteinte de l’ADNmt suite à l’irradiation à Hiroshima en 1945)"]],["Cytopathies mitochondriales (p.27)",["Large spectre de pathologies dont la caractéristique commune est un déficit génétique constitutionnel ou acquis de la chaîne respiratoire mitochondriale, d’origine mitochondriale ou nucléaire","Atteintes neurologique, sensorielle, cardiaque, digestive, rénale, hématologique, endocrinienne"]],["Syndromes (p.27)",["Liés à l’ADNmt : syndromes de Pearson, de Kearns-Sayre, de Leigh ; NARP (neuropathie ataxiante et rétinite pigmentaire) ; MELAS (encéphalomyopathie mitochondriale, acidose lactique et pseudo-AVC) ; MERRF (épilepsie myoclonique avec fibres ragged-red) ; LHON (neuropathie optique héréditaire de Leber)","Liés au génome nucléaire : SANDO, MSCAE, MIRAS, IOSCA, MNGIE, syndrome d’Alpers"]],["Diagnostic (p.28)",["Exploration tissulaire : histopathologie (histochimique et histo-enzymologique, immunohistochimique ex : COX I, ultrastructurale) ; première méthode utilisable, la plus simple ; exemple : fibres rouges déchiquetées (Ragged Red Fibers : prolifération massive de mitochondries observable avec une coloration rouge)","Exploration métabolique in vivo (premier dépistage des déficits de la chaîne respiratoire, peu coûteuse) ; exploration biochimique des protéines de la chaîne respiratoire ; diagnostic moléculaire des deux génomes (explorations coûteuses et longues)"]]]},
{"id":"ves2","t":"ves","a":4,"r":V2,"q":"Les 4 étapes de formation d’une vésicule de transport (ordre) ?","p":"p.6","s":[["Formation des vésicules en 4 étapes",["① Bourgeonnement ✪✪ à partir du compartiment donneur","② Guidage ✪✪ de la vésicule","③ Amarrage ✪✪ de la vésicule sur le compartiment cible : arrivée de la vésicule à proximité du compartiment cible","④ Fusion ✪✪ entre la vésicule et le compartiment cible : la fusion n’a pas obligatoirement lieu immédiatement après l’amarrage (délai possible)"]],["Bourgeonnement",["Implique des protéines du manteau vésiculaire : protéines de recouvrement et protéines adaptatrices","Implique la dynamine"]]]},
{"id":"ves3","t":"ves","a":4,"r":V2,"q":"Voies de communication du réseau endomembranaire : antérograde, rétrograde, sécrétoire, endocytaire ?","p":"p.3-5","s":[["Communication entre les partenaires du réseau endomembranaire ✪ et la membrane plasmique (p.4)",["Voie antérograde + voie rétrograde : respectivement transport du RE vers l’appareil de Golgi et transport de l’appareil de Golgi vers le RE ; les protéines structurales du RE peuvent transiter par l’appareil de Golgi pour terminer leur maturation et retourner dans le RE pour y jouer leur rôle","Voie sécrétoire : transport vésiculaire de l’appareil de Golgi vers la membrane plasmique, permet la sortie de molécules ; la sécrétion peut être constitutive ou contrôlée","Voie endocytaire : permet l’entrée de molécules dans la cellule","Voie de retour"]],["Voie antérograde RE → Golgi (p.5)",["Sortie de protéines bien repliées : plus de 90 % des protéines sont bien repliées ; adressage au Golgi ; phénomène spécifique avec signaux de sortie (pas de séquence unique)","Sortie sans signal de sortie : phénomène observé mais plus lent et non spécifique ; une protéine correctement repliée qui se trouve dans une région du RE destinée à former un site de sortie peut être incorporée de manière relativement passive dans des vésicules","Sortie de protéines mal repliées : adressage aux protéasomes"]],["Voie rétrograde Golgi → RE (p.5)",["Retour de protéines pour le maintien de l’intégrité des compartiments ; en particulier retour des protéines résidentes dans le RE grâce à des séquences spécifiques de reconnaissance, présentes à l’extrémité C-terminale","Séquence KDEL ✪✪ (Lys-Asp-Glu-Leu) pour les protéines solubles : reconnue par un récepteur KDEL golgien","Séquence KKxx ✪ pour les protéines membranaires : reconnue par les sous-unités du manteau COP I"]],["Appareil de Golgi = interface entre le RE, la membrane plasmique et les lysosomes (p.3)",["Les molécules provenant du RE passent par l’appareil de Golgi avant de rejoindre la membrane plasmique ou les lysosomes ; celles qui rejoignent le RE depuis la membrane plasmique doivent passer par l’appareil de Golgi","Les protéoglycanes formés dans l’appareil de Golgi sont chargés négativement : retrouvés dans la matrice extracellulaire du tissu conjonctif, ils attirent les ions Na⁺/Ca²⁺ ce qui permet d’augmenter la quantité d’eau à leur périphérie","Nécessité d’une orientation spécifique : les échanges permanents entre les compartiments devraient finir par entraîner le mélange des molécules (tous les compartiments finiraient par être identiques) ; solution : des molécules de reconnaissance permettent d’orienter spécifiquement le transport"]]]},
{"id":"ves4","t":"ves","a":4,"r":V2,"q":"Protéines de recouvrement : COP I, COP II, clathrine (voie, sous-unités, observation) ?","p":"p.7-8","s":[["3 types de protéines de recouvrement spécifiques du parcours vésiculaire (p.7)",["COP II pour la voie antérograde : recouvre les vésicules qui sortent du RE pour aller vers l’appareil de Golgi","COP I pour la voie rétrograde : recouvre les vésicules de circulation à partir de l’appareil de Golgi","Clathrine : recouvre les vésicules provenant de l’appareil de Golgi (trans) et se dirigeant vers les endosomes, les lysosomes et la membrane plasmique ✪ ; recouvre certaines vésicules d’endocytose à partir de la membrane plasmique"]],["Sous-unités (p.8)",["COPI : constituée de 7 sous-unités ✪ (nommées par des lettres grecques)","COPII : constituée de 4 sous-unités : Sec23, Sec24, Sec13 et Sec31"]],["Observation (p.7)",["Visibles en microscopie électronique ✪ ; aspect similaire pour COP I et COP II ; aspect différent pour la clathrine"]]]},
{"id":"ves5","t":"ves","a":4,"r":V2,"q":"Clathrine : triskélion et manteau de clathrine ?","p":"p.8, 13","s":[["Triskélion (p.8)",["Unité de base du manteau de clathrine ✪✪","Formé par l’assemblage de 6 chaînes protéiques : 3 chaînes lourdes et 3 chaînes légères ; association par de nombreuses liaisons faibles dans un environnement stable"]],["Manteau de clathrine (p.8)",["n molécules de triskélion s’assemblent pour former le manteau de clathrine : architecture en « nid d’abeille » (diamètre d’environ 120 nm)","Organisation supra-moléculaire en réseau convexe"]],["Rôles du manteau dans le cas des clathrines (p.13)",["Sélectionner les molécules à transporter : grâce aux molécules adaptatrices","Déterminer la forme et la taille de la vésicule : grâce aux molécules de recouvrement ✪","Déterminer la destination de la vésicule : en lien avec les molécules de recouvrement ; sélection d’autres protéines servant à indiquer la destination"]]]},
{"id":"ves6","t":"ves","a":4,"r":V2,"q":"Petites protéines G de recrutement (Sar1, ARF) : GEF, GAP, assemblage du manteau COP II ?","p":"p.9-10","s":[["Mécanisme contrôlé (p.9)",["Implication de protéines de recrutement : petites protéines G ; dépendantes du GTP ✪","Famille des protéines ARF (ADP Ribosylation Factor) : pour les manteaux de clathrine et pour les manteaux de COPI","Sar1 : pour les manteaux de COPII ✪"]],["Activation et inactivation des petites protéines G (p.10)",["Inactives lorsqu’elles sont associées au GDP ; actives lorsqu’elles sont associées au GTP","1ère phase : passage de la forme inactive (G-GDP) à la forme active (G-GTP) : le facteur d’échange GEF (Guanine-nucleotide Exchange Factor) aide au remplacement du GDP par du GTP","L’activité des petites protéines G permet de fournir l’énergie nécessaire à l’assemblage des protéines de recouvrement : la petite protéine G hydrolyse le GTP en GDP ; cette activité intrinsèque d’hydrolyse du GTP est accélérée par la protéine GAP (GTPase-Activating Protein)"]],["Intervention de Sar1 dans l’assemblage du manteau COP II ✪ (p.10)",["① La petite protéine G Sar1 cytosolique est liée au GDP, et est donc inactive ✪ ; GEF (Sec12), présente dans la membrane du RE, permet le remplacement du GDP par du GTP ✪ sur Sar1 : passage dans un état actif","② Association de Sar1 à la membrane du RE","③ Recrutement de sec23 et sec24 : sec23 interagit avec Sar1 ; sec24 reconnaît des motifs sur les protéines à transporter","④ Sec13 et sec31 se fixent ensuite à sec23 et sec24 : l’encombrement stérique entraîne une déformation progressive de la membrane vésiculaire"]]]},
{"id":"ves7","t":"ves","a":4,"r":V2,"q":"Protéines adaptatrices : rôle et cas des protéines solubles / transmembranaires ?","p":"p.11-13","s":[["Rôle et particularité (p.11)",["Les protéines adaptatrices favorisent la capture des molécules à transporter ; les protéines matures à transporter sont soit solubles, soit transmembranaires","Dans le cas de COPII, sec24 peut jouer le rôle de protéine adaptatrice : rôle bivalent (protéine de recouvrement et protéine adaptatrice) ; rôle bivalent également pour COP I"]],["Cas des protéines solubles à transporter : 4 partenaires (p.12)",["Protéine de recouvrement ; protéine adaptatrice ; récepteur de chargement ; molécule soluble à transporter portant un peptide de destination","La molécule à transporter est reconnue par un récepteur de chargement membranaire","Le récepteur de chargement est reconnu par la protéine adaptatrice grâce à des signaux de reconnaissance dans la partie cytosolique du récepteur de chargement (activation du récepteur pour augmenter l’affinité pour la protéine à transporter)","La protéine adaptatrice reconnaît également la protéine de recouvrement ; ex : reconnaissance de la clathrine par l’adaptine ✪ (protéine adaptatrice)","La protéine adaptatrice est donc spécifique de la protéine de recouvrement ✪ et du récepteur de chargement"]],["Cas des protéines transmembranaires à transporter : 3 partenaires (p.13)",["Protéine de recouvrement ; protéine adaptatrice ; molécule à transporter portant un peptide de destination","La protéine adaptatrice reconnaît spécifiquement la protéine de recouvrement ; elle reconnaît également directement ✪✪ la protéine transmembranaire à transporter grâce à des signaux de reconnaissance dans la partie cytosolique de cette dernière","Particularité : pas de récepteur de chargement (la protéine à transporter est déjà localisée dans la membrane)"]]]},
{"id":"ves8","t":"ves","a":4,"r":V2,"q":"Dynamine : isoformes et mécanisme de libération de la vésicule ?","p":"p.14","s":[["GTPase de 100 kDa",["Protéine capable d’hydrolyser le GTP"]],["3 isoformes chez les mammifères",["Dynamine 1 : majoritairement retrouvée dans le cerveau","Dynamine 2 : ubiquitaire ✪","Dynamine 3 : très présente dans le testicule, mais également retrouvée dans le cerveau et le poumon ; présence dans le testicule > cerveau > poumon"]],["Protéine impliquée dans la fission membranaire",["La formation d’un rétrécissement lié à la déformation de la membrane crée un environnement membranaire favorable au recrutement et à l’assemblage de la dynamine","La forme prise par la dynamine dépend de protéines associées"]],["Mécanisme de libération de la vésicule",["Des polymères de dynamine forment un anneau à la base de la vésicule","L’hydrolyse du GTP induit un changement de conformation des polymères ce qui permet une constriction : pincement de la membrane et fusion des feuillets membranaires","Scission permettant le détachement de la vésicule et la libération de la dynamine"]]]},
{"id":"ves9","t":"ves","a":4,"r":V2,"q":"SNAREs : v-SNARE, t-SNARE, rôle dans la fusion, cellules nerveuses, neurotoxines ?","p":"p.19-21","s":[["Fusion ≠ amarrage (p.19)",["L’amarrage implique des interactions protéine-protéine : entre Rab et Rab effecteur","La fusion implique une interaction des bicouches lipidiques"]],["Les SNAREs (p.20)",["Protéines transmembranaires ✪ ; récepteurs (SNAP receptors) ; au moins 20 espèces différentes de SNAREs","v-SNARE (v pour vesicle) = récepteur spécifique de la vésicule ; t-SNARE (t pour target) = récepteur spécifique de la membrane cible","Combinaisons spécifiques entre v- et t-SNAREs : le domaine hélicoïdal de la v-SNARE s’enroule avec le domaine hélicoïdal de la t-SNARE pour former un complexe trans-SNARE, important pour la fusion des membranes","La spécificité du rapprochement des membranes n’est pas due exclusivement aux SNAREs ; un seul complexe v-SNARE/t-SNARE n’est souvent pas suffisant pour permettre la fusion : au moins 2 complexes"]],["Rôle des SNAREs dans la fusion (p.19)",["Elles permettent l’extrusion de molécules d’eau : les SNAREs jouent un rôle de treuil ✪ pour rapprocher les deux membranes ; l’élimination totale des molécules d’eau entre les deux membranes est nécessaire pour la réalisation de la fusion (mécanisme passif)","Des protéines supplémentaires permettent de réguler la fusion : protéines SM","Dans certains cas, la fusion peut être déclenchée par des signaux extérieurs (exemple : exocytose régulée : fusion déclenchée par la fixation d’un ligand sur un récepteur) ; dans d’autres cas, la fusion ne nécessite pas de signal (sécrétion continue)"]],["Cas particulier des cellules nerveuses (p.21)",["4 hélices α participent au complexe SNARE : 3 hélices α formées par t-SNARE (2 de snap25 et 1 de syntaxine) et 1 hélice α formée de v-SNARE (synaptobrévine) ; l’ensemble permet le maintien des deux membranes avant fusion, et joue donc un rôle dans la transmission synaptique","Les SNAREs sont les cibles de neurotoxines sécrétées par des bactéries responsables du tétanos ou du botulisme ✪ : ces neurotoxines sont des protéases qui entrent dans des neurones spécifiques, clivent les SNAREs et bloquent la transmission synaptique, ce qui engendre des maladies paralytiques","Régulation : la synaptotagmine réagit à l’arrivée massive de Ca²⁺ en amont de la synapse et accélère le processus de fusion (fusion rapide des membranes) ; la complexine agit comme stabilisateur du complexe SNARE et participe au contrôle de la fusion dépendante du Ca²⁺ en plus des protéines SM"]]]},
{"id":"ves10","t":"ves","a":3,"r":V2,"q":"Protéines Rab : rôle dans l’amarrage, mécanisme, Rab effecteur ?","p":"p.16-18","s":[["Amarrage des vésicules ✪ : protéines Rab (p.17)",["Petites protéines G à activité GTPasique ; plus de 30 membres ; chaque organite a au moins une protéine Rab sur sa face cytosolique","Exemples : Rab1 (RE et appareil de Golgi) ; Rab2 (réseau cis-golgien) ; Rab3A (vésicules synaptiques et granules de sécrétion) ; Rab4 et Rab5C (endosomes précoces) ; Rab5A (membrane plasmique et vésicules recouvertes de clathrine) ; Rab6 (citernes du Golgi médian et trans) ; Rab7 (endosomes tardifs) ; Rab8 (vésicules de sécrétion basolatérales) ; Rab9 (endosomes tardifs et réseau trans-golgien)","Comme les petites protéines G de recrutement, les Rab circulent du cytosol à la membrane des vésicules, sont fixées par une ancre hydrophobe et sont actives sous leur forme associée au GTP","En s’associant à un effecteur de Rab, elles facilitent et régulent le taux d’amarrage des vésicules et l’appariement des v-SNARE et t-SNARE"]],["Mécanisme d’action des protéines Rab (p.18)",["① À la surface de la vésicule, Rab est active (liée au GTP) et associée à une v-SNARE","② Rab est reconnue par un complexe Rab effecteur, présent à la surface du compartiment cible ✪","③ Rab favorise l’interaction entre la v-SNARE et la t-SNARE","④ Phénomène de fusion membranaire entre la vésicule et le compartiment cible","⑤ Aidée par GAP, Rab revient à son état inactif (liée au GDP, grâce à l’hydrolyse du GTP) : forme cytosolique jusqu’à ce que GEF lui permette de repasser sous forme active en remplaçant le GDP par du GTP"]],["Rab effecteur (p.18)",["Complexe protéique spécifique d’une protéine Rab ; empêche l’hydrolyse prématurée du GTP ✪ de Rab ; favorise l’interaction v-SNARE/t-SNARE"]],["Spécificité d’adressage (p.16)",["Les Rab sont spécifiques des compartiments et des étapes du trafic (ce n’est pas « une Rab = une vésicule du début à la fin ») ; exemple du passage de l’endosome précoce à l’endosome tardif : Rab5 active, puis inactivation de Rab5 et activation de Rab7 ; les Rab sont présentes dans la membrane sous forme active ou inactive"]],["Mutation (p.18)",["Une mutation du gène codant Rab7 conduit à la maladie de Charcot-Marie-Tooth (neuropathie sensitivomotrice héréditaire : affaiblissement lent et progressif des muscles des membres inférieurs, lié à une dégénérescence des nerfs périphériques ; diagnostic par biologie moléculaire)"]]]},
{"id":"ves11","t":"ves","a":0,"r":V2,"q":"Guidage des vésicules : microtubules, kinésines, dynéines ?","p":"p.16","s":[["Guidage : la voie principale = les microtubules",["Fonction : transport sur de longues distances (acheminer les vésicules sur de grandes distances avec précision)","Microtubules polarisés : extrémité (-) orientée vers le centrosome ; extrémité (+) proche de la membrane plasmique","Kinésines : vers l’extrémité (+) : transport antérograde (ex : RE → Golgi → membrane plasmique)","Dynéines : vers l’extrémité (-) : transport rétrograde (ex : endosomes → RE)"]],["Spécificité d’adressage",["Phénomènes de reconnaissance entre la vésicule de transport et la membrane cible : récepteurs spécifiques de la vésicule de transport et du chargement, et récepteurs complémentaires et spécifiques de la membrane cible"]]]},
{"id":"ves12","t":"ves","a":0,"r":V2,"q":"Démantèlement du manteau et après la fusion (NSF, SNAP) ?","p":"p.15, 22","s":[["Démantèlement du manteau (p.15)",["Pour les manteaux de COP I, COP II et clathrine : commence par l’hydrolyse du GTP de la petite protéine G de recrutement","Désassemblage des triskélions : fait intervenir une protéine chaperonne (hsc70 de la famille hsp70) et de l’ATP : rupture des liaisons faibles","Permet le recyclage des protéines de recouvrement et des protéines adaptatrices, qui pourront être réutilisées"]],["Après la fusion : dissociation des SNAREs (p.22)",["Permise par SNAP (soluble NSF attachment proteins) et une protéine chaperonne NSF (N-ethylmaleimide-sensitive-fusion protein) : SNAP se fixe sur le complexe SNARE et recrute NSF ; la chaperonne NSF est une ATPase qui permet de séparer les SNAREs (consommation d’ATP)","Permet une réutilisation des SNAREs"]],["Analogie avec l’infection virale (p.22)",["Le virus HIV s’attache à CD4, ce qui permet à gp120 de se lier à un récepteur du lymphocyte ; les protéines de fusion du virus jouent alors un rôle équivalent à v-SNARE et t-SNARE : rapprochement du virus de la membrane, puis fusion et libération de la particule virale dans la cellule cible"]]]},
{"id":"ves13","t":"ves","a":0,"r":V2,"q":"Résumé : acteurs du transport vésiculaire à chaque étape ?","p":"p.21, 23","s":[["Résumé (p.21)",["Transport : kinésines / dynéines","Adressage : Rab + protéines accessoires","Arrimage éloigné : Rab","Arrimage rapproché : SNAREs + protéines SM","Fusion : complexe SNARE","Régulation de la fusion : protéines SM ; ± complexine et synaptotagmine selon le contexte"]],["En résumé (p.23)",["Bourgeonnement : protéines de recouvrement ✪ (COPI, COPII, clathrine) ; GTPases de recrutement (Sar1, ARF) ; protéines adaptatrices ; GTPase : dynamine ✪","Guidage, amarrage, fusion : GTPases Rab ; effecteur de Rab ; SNAREs"]]]},
